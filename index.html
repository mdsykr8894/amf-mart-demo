<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta id="site-description" name="description" content="AMF Mart electrical product catalogue for home use, technical work and business needs.">
  <title>AMF Mart</title>
  <link id="site-favicon" rel="icon" type="image/png" href="assets/logo/electrical-shop-black%20-%20Copy.png">
  <link id="site-apple-touch-icon" rel="apple-touch-icon" href="assets/logo/electrical-shop-black%20-%20Copy.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <style>
    /* ================================================================
       Theme tokens — edit this block for global visual changes.
       ================================================================ */
    :root {
      /* Colour */
      --color-ink: #181A20;
      --color-text: #181A20;
      --color-muted: #6B7280;
      --color-muted-strong: #3F4652;
      --color-muted-faint: #9AA1AC;
      --color-brand: #FF595B;
      --color-brand-hover: #E74D50;
      --color-brand-border: #FFB4B6;
      --color-focus-ring: rgba(255, 89, 91, .22);
      --color-surface: #FFFFFF;
      --color-canvas: #FBFCFD;
      --color-subtle: #F5F6F8;
      --color-brand-soft: #FFF0F0;
      --color-brand-tint: #FFF8F8;
      --color-state-hover-surface: var(--color-subtle);
      --color-state-active-surface: var(--color-brand-soft);
      --color-state-active-border: var(--color-brand);
      --color-border: #E5E7EB;
      --color-border-soft: #F1F2F4;
      --color-border-control: #D9DEE6;
      --color-success: #1F8A5B;
      --color-whatsapp: #27C166;
      --color-whatsapp-hover: #18AE5B;
      --color-facebook: #1877F2;
      --color-tiktok: #2B2B31;
      --color-tiktok-border: #73737B;
      --color-on-dark: #F7F8FA;
      --color-on-dark-strong: rgba(247,248,250,.82);
      --color-on-dark-muted: rgba(247,248,250,.68);
      --color-on-dark-subtle: rgba(247,248,250,.55);
      --color-on-dark-disabled: rgba(247,248,250,.38);

      /* Typography */
      --font-sans: 'Manrope', Arial, sans-serif;
      --font-size-body: 16px;
      --font-size-label: 12px;
      --font-size-button: 14px;
      --font-size-page-title: clamp(30px, 3.6vw, 44px);
      --font-size-section-title: clamp(22px, 3vw, 30px);
      --line-height-body: 1.55;
      --line-height-heading: 1.15;
      --font-weight-regular: 400;
      --font-weight-medium: 500;
      --font-weight-semibold: 600;
      --font-weight-bold: 700;
      --font-weight-heading: 800;

      /* Spacing, layout and interaction */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-7: 32px;
      --space-8: 40px;
      --space-9: 48px;
      --space-section: 64px;
      --content-max: 1192px;
      --content-gutter: 28px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --control-height: 44px;
      --duration-micro: 190ms;
      --duration-standard: 280ms;
      --duration-reveal: 900ms;
      --duration-card-reveal: 780ms;
      --duration-navigation: 460ms;
      --ease-standard: cubic-bezier(.4, 0, .2, 1);
      --ease-emphasized: cubic-bezier(.22, .61, .36, 1);
      --ease-smooth: cubic-bezier(.22, .61, .36, 1);
      --transition-fast: var(--duration-micro) var(--ease-standard);
      --transition-standard: var(--duration-standard) var(--ease-standard);
      --transition-navigation: var(--duration-navigation) var(--ease-emphasized);
      --shadow-hover: 0 12px 28px rgba(27, 27, 31, .08);
      --nav-height: 72px;

      /* Legacy aliases kept while the active CSS is progressively unified. */
      --charcoal: var(--color-ink);
      --ink: var(--color-text);
      --grey: var(--color-muted);
      --red: var(--color-brand);
      --red-dark: var(--color-brand-hover);
      --white: var(--color-surface);
      --bg: var(--color-surface);
      --warm: var(--color-canvas);
      --muted: var(--color-subtle);
      --accent: var(--color-brand-soft);
      --border: var(--color-border);
      --success: var(--color-success);
      --max-width: var(--content-max);
    }

    /* V5: Native pull-to-refresh and catalogue-state fixes. */
    /* Foundation */
    * { box-sizing: border-box; }
    html {
      scroll-behavior: smooth;
      background: var(--bg);
      overflow-x: hidden;
      overflow-x: clip;
      /* Allow native browser pull-to-refresh at the top of the page. */
      overscroll-behavior-y: auto;
    }
    body {
      margin: 0;
      color: var(--color-text);
      background: var(--bg);
      font-family: var(--font-sans);
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
      min-width: 0;
      overflow-x: hidden;
      overflow-x: clip;
      overscroll-behavior-y: auto;
    }
    /* Keep the body out of overflow:hidden: that creates a new scroll container
       and dislodges the sticky mobile header when its menu opens mid-page. */
    body.menu-open { overflow-x: clip; overflow-y: clip; }
    html.menu-open { overflow-y: hidden; }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; }
    button, a {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; }
    img { max-width: 100%; }
    :focus-visible {
      outline: 3px solid var(--color-focus-ring);
      outline-offset: 3px;
    }
    /* Reusable utilities and interactive elements */
    .skip-link {
      position: fixed;
      z-index: 100;
      top: 12px;
      left: 12px;
      transform: translateY(-160%);
      background: var(--charcoal);
      color: var(--white);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
    }
    .skip-link:focus { transform: translateY(0); }
    .site-container {
      width: min(calc(100% - (var(--content-gutter) * 2)), var(--content-max));
      margin-inline: auto;
    }
    /* Global navigation */
    .announcement {
      background: var(--red);
      color: var(--white);
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .02em;
      transition: opacity var(--transition-standard), transform var(--transition-standard), max-height var(--transition-standard);
    }
    .announcement-inner {
      width: min(calc(100% - 56px), 1192px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-inline: auto;
    }
    .announcement-left,
    .announcement-right {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .announcement-right { text-align: right; }
    .announcement.is-hidden {
      max-height: 0;
      min-height: 0;
      padding-block: 0;
      opacity: 0;
      transform: translateY(-100%);
      overflow: hidden;
    }
    .main-nav {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    .nav-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .brand-logo { display: inline-flex; align-items: center; flex: 0 0 auto; }
    .brand-logo img { display: block; width: 132px; height: auto; }
    .nav-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex: 1;
    }
    .nav-link, .nav-action {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      position: relative;
      color: var(--charcoal);
      border: 0;
      background: transparent;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 700;
      transition: color var(--transition-fast);
    }
    .nav-link:hover, .nav-action:hover {
      color: var(--red);
      background: transparent;
    }
    .nav-link::after {
      content: "";
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: 4px;
      height: 2px;
      transform: scaleX(0);
      transform-origin: center;
      background: var(--red);
      border-radius: 99px;
      transition: transform var(--transition-navigation);
    }
    .nav-link:hover::after, .nav-link.is-active::after {
      transform: scaleX(1);
    }
    .nav-link.is-active {
      color: var(--red);
      background: transparent;
    }
    .nav-link.is-disabled,
    .nav-action.is-disabled {
      color: var(--charcoal);
      cursor: not-allowed;
      opacity: 1;
    }
    .nav-link.is-disabled:hover,
    .nav-action.is-disabled:hover {
      color: var(--red);
      background: transparent;
    }
    .nav-link.is-disabled::after { display: none; }
    .nav-action.is-disabled::after {
      content: attr(data-tooltip);
      position: absolute;
      right: calc(100% + 12px);
      top: 50%;
      padding: 8px 12px;
      transform: translateY(-50%) translateX(4px);
      color: var(--charcoal);
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 9px;
      box-shadow: 0 8px 22px rgba(27,27,31,.1);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-standard), transform var(--transition-standard);
    }
    .nav-action.is-disabled:hover::after,
    .nav-action.is-disabled:focus-visible::after {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
    }
    .nav-actions { display: flex; align-items: center; gap: 4px; }
    .menu-toggle { display: none; }
    .mobile-menu { display: none; }
    /* Icons inherit the semantic colour of their parent control or text. */
    .icon { width: 18px; height: 18px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon-fill { fill: currentColor; stroke: none; }
    main {
      min-height: 55vh;
      min-height: 55svh;
    }
    .page-content { padding: 48px 0 88px; }
    .hero {
      padding: 0;
      background: var(--warm);
    }
    .hero .site-container {
      width: 100%;
      max-width: none;
    }
    .hero-figure {
      margin: 0;
      position: relative;
      height: clamp(360px, 36vw, 560px);
      overflow: hidden;
      border-radius: 0;
      background: var(--charcoal);
    }
    .hero-figure img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .eyebrow, .section-kicker {
      color: var(--red);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { line-height: var(--line-height-heading); letter-spacing: -.02em; }
    h1 { margin-bottom: 18px; font-size: clamp(32px, 5vw, 48px); font-weight: var(--font-weight-heading); }
    h2 { margin-bottom: 14px; font-size: clamp(26px, 4vw, 32px); font-weight: var(--font-weight-heading); }
    h3 { margin-bottom: 8px; font-size: 20px; font-weight: var(--font-weight-heading); }
    /* Shared buttons, links, sections and product cards */
    .btn {
      min-height: var(--control-height);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-button);
      font-weight: var(--font-weight-heading);
      transition: background var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast), transform var(--transition-fast);
    }
    @media (hover: hover) and (pointer: fine) {
      .btn:hover { transform: translateY(-1px); }
    }
    .btn-primary { background: var(--red); color: var(--white); }
    .btn-primary:hover { background: var(--red-dark); }
    .btn-secondary { background: var(--white); color: var(--charcoal); border-color: var(--border); }
    .btn-secondary:hover { border-color: var(--charcoal); }
    .btn-disabled, .btn:disabled { background: var(--muted); color: var(--grey); border-color: var(--border); }
    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: var(--control-height);
      color: var(--red);
      font-size: var(--font-size-button);
      font-weight: var(--font-weight-heading);
    }
    .text-link .icon { transition: transform var(--transition-fast); }
    .text-link:hover { color: var(--red-dark); }
    @media (hover: hover) and (pointer: fine) {
      .text-link:hover .icon { transform: translateX(3px); }
    }
    .related-section {
      border-top: 1px solid var(--border);
    }
    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 26px;
    }
    .section-heading h2 { margin-bottom: 0; }
    .product-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; align-items: start; }
    .product-card {
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      cursor: pointer;
      background: var(--white);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      transition: border-color var(--transition-fast), transform var(--transition-fast);
    }
    .product-card:hover { border-color: var(--color-brand-border); }
    .product-card:focus-visible { outline: 2px solid var(--color-brand); outline-offset: 3px; }
    @media (hover: hover) and (pointer: fine) {
      .product-card:hover { transform: translateY(-2px); }
    }
    .product-card-image {
      position: relative;
      aspect-ratio: 1 / .78;
      display: grid;
      place-items: center;
      padding: 0;
      background: var(--color-canvas);
      border-bottom: 1px solid var(--border);
    }
    .product-card-image img, .detail-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .image-fallback {
      color: var(--grey);
      background: var(--muted);
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      padding: 20px;
    }
    .product-card-body { display: flex; flex-direction: column; padding: 16px; }
    .product-category { margin-bottom: 8px; color: var(--red); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .product-card h3 { min-height: 38px; margin-bottom: 0; overflow: hidden; font-size: 14px; line-height: 1.35; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .product-meta { min-height: 0; margin: 8px 0 0; color: var(--grey); font-size: 11px; line-height: 1.4; }
    .product-spec-line {
      min-height: 0;
      margin: 12px 0 0;
      color: var(--grey);
      font-size: 11px;
      line-height: 1.45;
    }
    .product-card-footer { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--color-border-soft); }
    .product-card .text-link { min-height: 30px; font-size: 12px; }
    .brand-tile {
      min-height: 86px;
      display: grid;
      place-items: center;
      padding: 14px 20px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .brand-tile img { max-width: 100%; max-height: 42px; }
    .brand-tile span { color: var(--grey); font-size: 14px; font-weight: 800; }
    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 18px;
      color: var(--grey);
      font-size: 13px;
      font-weight: 700;
    }
    .breadcrumb a:hover { color: var(--red); }
    .breadcrumb .current { color: var(--charcoal); }
    .breadcrumb-only {
      width: 100%;
      min-height: 64px;
      display: flex;
      align-items: center;
      margin: 0;
      padding-inline: 0;
      border-bottom: 1px solid var(--border);
      background: var(--white);
    }
    .breadcrumb-only .breadcrumb {
      margin-bottom: 0;
      font-size: 12px;
    }
    .breadcrumb-only > .site-container {
      width: 100%;
      max-width: 1192px;
      margin-inline: auto;
    }
    .catalogue-layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; align-items: start; margin-top: 34px; }
    .catalogue-filter-column { align-self: start; position: static; }
    .filter-panel { position: static; }
    .filter-card {
      padding: 18px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }
    .filter-card + .filter-card { margin-top: 14px; }
    .filter-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 800;
    }
    .filter-list { display: grid; gap: 3px; }
    .filter-list-scroll {
      max-height: 410px;
      overflow-y: auto;
      padding-right: 4px;
      scrollbar-gutter: stable;
    }
    .filter-option {
      width: 100%;
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--grey);
      text-align: left;
      font-size: 13px;
    }
    .filter-option:hover, .filter-option.is-active { background: var(--accent); color: var(--red); font-weight: 800; }
    .filter-option input { accent-color: var(--red); }
    .filter-clear { width: 100%; margin-top: 12px; }
    .catalogue-topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    .search-wrap { position: relative; flex: 1; }
    .search-wrap .icon { position: absolute; top: 11px; left: 13px; color: var(--grey); }
    .search-input {
      width: 100%;
      min-height: 42px;
      padding: 8px 14px 8px 42px;
      color: var(--charcoal);
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .search-input:focus { border-color: var(--red); outline: 3px solid var(--color-focus-ring); }
    .sort-wrap { min-width: 176px; }
    .result-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      color: var(--grey);
      font-size: 13px;
      font-weight: 700;
    }
    .result-bar strong { color: var(--charcoal); }
    .filter-toggle { display: none; }
    .empty-state {
      padding: 48px 24px;
      background: var(--warm);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      text-align: center;
    }
    .empty-state .empty-icon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      color: var(--red);
      background: var(--accent);
      border-radius: 50%;
    }
    .empty-state p { max-width: 460px; margin: 0 auto 20px; color: var(--grey); }
    .pagination { display: flex; flex-wrap: wrap; justify-content: center; row-gap: 10px; margin-top: 32px; }
    .pagination-wide,
    .pagination-compact { display: flex; align-items: center; gap: 8px; }
    .pagination-wide { flex-wrap: wrap; justify-content: center; }
    .pagination-compact { display: none; }
    .pagination-go {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 100%;
      justify-content: center;
      margin: 0;
      color: var(--grey);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }
    .pagination-go input {
      width: 64px;
      height: 42px;
      padding: 0 10px;
      color: var(--charcoal);
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      text-align: center;
    }
    .pagination-go input:focus {
      border-color: var(--color-brand);
      outline: none;
      box-shadow: none;
    }
    .page-button {
      width: 42px;
      min-width: 42px;
      height: 42px;
      min-height: 42px;
      display: inline-grid;
      place-items: center;
      padding: 0;
      color: var(--grey);
      background: var(--white);
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      transition: color var(--transition-fast), background-color var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
    }
    .page-button:hover:not(:disabled) { color: var(--red); background: var(--accent); }
    .page-button.is-active {
      color: var(--charcoal);
      background: var(--color-brand-soft);
      border: 2px solid var(--red);
      box-shadow: none;
    }
    .page-button:disabled { color: var(--color-muted-faint); background: var(--color-subtle); border-color: transparent; cursor: not-allowed; }
    .page-button-icon { width: 42px; padding: 0; border-color: var(--border); }
    .page-button-icon:hover:not(:disabled) { border-color: var(--border); }
    .page-button-icon .icon { width: 17px; height: 17px; }
    .page-button-nav {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      min-width: 96px;
      padding-inline: 13px;
      gap: 6px;
      border-color: var(--border);
      white-space: nowrap;
    }
    .page-button-nav:hover:not(:disabled) { border-color: var(--border); }
    .page-button-nav .icon { width: 16px; height: 16px; }
    .pagination-ellipsis {
      width: 26px;
      color: var(--grey);
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      user-select: none;
    }

    /* Custom sort control: keeps the open menu visually consistent across browsers. */

    /* ================================================================
       Canonical responsive layout
       Desktop: 1200px+, tablet: 768–1199px, phone: below 768px.
       These rules intentionally sit last so every shared component has one
       predictable responsive contract while legacy rules are retired.
       ================================================================ */
    :root {
      --content-gutter: 28px;
      --type-body: 16px;
      --type-label: 12px;
      --type-card-title: 15px;
      --type-page-title: clamp(36px, 3.4vw, 44px);
      --type-section-title: clamp(26px, 2.5vw, 30px);

      --section-space: 64px;
    }

    body { font-size: var(--type-body); }
    .announcement { padding-inline: 0; }
    .site-container,
    .announcement-inner {
      width: min(calc(100% - (var(--content-gutter) * 2)), var(--content-max));
      margin-inline: auto;
    }

    /* Keep the breadcrumb in document flow and let it stick beneath the
       navigation. This avoids scroll-time JavaScript and visual jitter. */
    .page-content { padding: 0 0 76px; }
    .breadcrumb-only {
      position: sticky;
      top: var(--nav-height);
      z-index: 25;
      width: 100%;
      min-height: var(--breadcrumb-height);

      margin: 0;
      padding: 0;

      border: 0;
      border-bottom: 1px solid var(--color-border);
      box-shadow: none;
    }
    .breadcrumb-only > .site-container {
      width: min(calc(100% - (var(--content-gutter) * 2)), var(--content-max));
      max-width: var(--content-max);
      min-width: 0;
      margin-inline: auto;
      padding: 0;

    .breadcrumb-only .breadcrumb {

    .standard-page-header {

      background: var(--color-surface);
      border: 0;
      border-radius: 0;
    }
    .standard-page-header.has-divider { border-bottom: 1px solid var(--color-border); }
    .standard-page-header h1 {
      margin: 0 0 8px;

      font-size: var(--type-page-title);
      line-height: var(--line-height-heading);
      letter-spacing: -.055em;
    }
    .standard-page-header p {
      margin: 0;
      color: var(--color-muted);
      font-size: var(--type-body);
      line-height: 1.55;
    }

    .section-heading h2,
    .home-section-heading h2,
    .about-refined-intro-copy h2,
    .contact-refined-contact-heading h2 {
      color: var(--color-ink);
      font-size: var(--type-section-title);
      line-height: var(--line-height-heading);
      letter-spacing: -.045em;

    }

    @media (min-width: 851px) {

      .nav-links { display: flex; flex: 1 1 auto; min-width: 0; }
      .nav-actions { display: flex; flex: 0 0 auto; }
    }

    /* Homepage headings use a real grid, preventing the title/link collision. */
    .home-section { padding: var(--section-space) 0; }
    .home-section-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      min-height: 38px;
      margin-bottom: 24px;
    }
    .home-section-heading h2 { grid-column: 2; }

    .product-detail-page,

    .product-detail-page .detail-layout,
    .product-detail-page .detail-panel,
    .product-detail-page .detail-image,

    .pagination {

      margin-top: 32px;
    }
    .pagination-wide { display: flex; }

    /* A product card is one link, so pointer, touch and keyboard all use the
       same destination and focus target. */
    .product-card {

      display: flex;
      flex-direction: column;
      height: 100%;
      color: inherit;
      text-decoration: none;
      background: var(--color-surface);
      border: 1px solid var(--color-border);

      transition: border-color var(--transition-fast), transform var(--transition-fast), background-color var(--transition-fast);
    }

    @media (hover: hover) and (pointer: fine) {

    }

    /* Catalogue: sidebar removes one card column; once it becomes a drawer,
       the result grid regains that column. */
    .products-page .catalogue-layout {
      grid-template-columns: 236px minmax(0, 1fr);
      gap: 28px;
      margin-top: 32px;
    }
    .products-page .catalogue-layout .product-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }
    .products-page .filter-title { font-size: 14px; }
    .products-page .filter-option { font-size: 13px; }
    .products-page .search-input { min-height: var(--control-height); font-size: var(--type-body); }

    /* Contact has one DOM order: heading, form, then alternatives. Grid areas

    .contact-refined-contact { padding: var(--section-space) 0; }
    .contact-refined-contact-grid {

      grid-template-areas:

      row-gap: 0;

      padding: 0;
      border: 0;

    .contact-refined-contact-form .form-field textarea { font-size: 14px; }

    @media (max-width: 1199px) {

      .home-category-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .home-featured-section .product-grid,
      .related-section .related-grid {
        display: flex;
        grid-template-columns: none;
        flex-wrap: nowrap;
        width: 100%;
        max-width: 100%;
        align-items: stretch;

      .home-featured-section .product-card,
      .related-section .related-grid .product-card {

        width: calc((100% - 54px) / 4);
        min-width: calc((100% - 54px) / 4);

      function brandIcon(name) {
        return icon(name, 'brand-mark');
      }

      function resolveImage(src) {
        if (!src) return '';
        return src.indexOf('assets/') === 0 ? 'catalogue/' + src : src;
      }

      function getCategory(id) {
        return (state.catalog.categories || []).find(function (category) { return category.id === id; });
      }

      function categoryName(id) {
        var category = getCategory(id);
        return category ? category.name : (categoryLabels[id] || 'Other');
      }

      function shortCategoryName(id) {
        return categoryLabels[id] || categoryName(id);
      }

      function setCatalogue(catalog) {
        state.catalog = catalog;
        state.technicalFilterIndex = null;
        state.productSearchIndex = new Map((catalog.products || []).map(function (product) {
          var searchText = [product.name, product.model, product.brand, categoryLabels[product.category_id] || product.category_id]
            .concat(Object.values(product.specifications || {}))
            .join(' ')
            .toLowerCase();
          return [product.id, searchText];
        }));
      }

      function clearCatalogue() {
        state.catalog = null;
        state.technicalFilterIndex = null;
        state.productSearchIndex = null;
      }

      function renderBreadcrumb(items) {
        var parts = [];
        items.forEach(function (item, index) {
          if (index) parts.push('<span aria-hidden="true">/</span>');
          if (item.href) {
            parts.push('<a href="' + escapeHtml(item.href) + '">' + escapeHtml(item.label) + '</a>');
            return;
          }
          parts.push('<span class="current"' + (item.title ? ' title="' + escapeHtml(item.title) + '"' : '') + '>' + escapeHtml(item.label) + '</span>');
        });
        return '<div class="breadcrumb-only"><div class="site-container"><div class="breadcrumb">' + parts.join('') + '</div></div></div>';
      }

      function routeInfo() {
        var raw = (window.location.hash || '#/').slice(1) || '/';
        var split = raw.split('?');
        var path = split[0] || '/';
        var query = new URLSearchParams(split[1] || '');
        var parts = path.split('/').filter(Boolean);
        if (parts[0] === 'product' && parts[1]) return { name: 'product', slug: decodeURIComponent(parts.slice(1).join('/')), query: query };
        return { name: parts[0] || 'home', query: query };
      }

      function navigate(hash) {
        /* Re-rendering the active route replays reveal motion and resets state. */
        if (window.location.hash === hash) return;
        window.location.hash = hash;
      }

      /* Keep catalogue state in the hash URL. Category links then start with a
         fresh set of filters, while Back/Forward and shared URLs restore the
         selected search, brand, category, technical filter and sort. */
      function defaultCatalogueFilters() {
        return { query: '', category: 'all', brands: [], techKey: '', techValue: '', sort: 'relevance' };
      }

      function readCatalogueFiltersFromRoute(route) {
        if (route.name !== 'products') return;
        var params = route.query;
        var next = defaultCatalogueFilters();
        next.query = params.get('q') || '';
        next.category = params.get('category') || 'all';
        next.brands = Array.from(new Set(params.getAll('brand').filter(Boolean)));
        next.techKey = params.get('tech') || '';
        next.techValue = next.techKey ? (params.get('value') || '') : '';
        var sort = params.get('sort') || 'relevance';
        next.sort = ['relevance', 'name-asc', 'name-desc'].indexOf(sort) !== -1 ? sort : 'relevance';
        state.filters = next;
        var requestedPage = Number(params.get('page') || 1);
        state.page = Number.isSafeInteger(requestedPage) && requestedPage > 0 ? requestedPage : 1;
        window.clearTimeout(searchInputTimer);
      }

      function syncCatalogueUrl() {
        if (routeInfo().name !== 'products') return;
        var params = new URLSearchParams();
        if (state.filters.category !== 'all') params.set('category', state.filters.category);
        if (state.filters.query) params.set('q', state.filters.query);
        state.filters.brands.forEach(function (brand) { params.append('brand', brand); });
        if (state.filters.techKey) {
          params.set('tech', state.filters.techKey);
          if (state.filters.techValue) params.set('value', state.filters.techValue);
        }
        if (state.filters.sort !== 'relevance') params.set('sort', state.filters.sort);
        if (state.page > 1) params.set('page', String(state.page));
        var hash = '#/products' + (params.toString() ? '?' + params.toString() : '');
        if (window.location.hash !== hash) window.history.replaceState(null, '', hash);
      }

      function setMenuState(isOpen) {
        state.menuOpen = Boolean(isOpen);
        document.body.classList.toggle('menu-open', state.menuOpen);
        document.documentElement.classList.toggle('menu-open', state.menuOpen);

        var toggle = document.querySelector('[data-action="toggle-menu"]');
        var glyph = toggle ? toggle.querySelector('.menu-toggle-glyph') : null;
        var menu = document.getElementById('mobile-navigation');
        var backdrop = document.querySelector('.mobile-menu-backdrop');

        if (toggle) {
          toggle.setAttribute('aria-expanded', state.menuOpen ? 'true' : 'false');
          toggle.setAttribute('aria-label', state.menuOpen ? 'Close menu' : 'Open menu');
        }
        if (glyph) glyph.classList.toggle('is-open', state.menuOpen);
        if (menu) {
          menu.classList.toggle('is-open', state.menuOpen);
          menu.setAttribute('aria-hidden', state.menuOpen ? 'false' : 'true');
        }
        if (backdrop) backdrop.classList.toggle('is-open', state.menuOpen);
      }

        return '<div class="announcement" id="announcement-bar"><div class="announcement-inner"><span class="announcement-left">' + escapeHtml(config.announcement.left) + '</span><span class="announcement-right">' + escapeHtml(config.announcement.right) + '</span></div></div>' +

              '<nav class="nav-links" aria-label="Primary navigation">' +
                navLink('#/', 'Home', active === 'home') +
                navLink('#/products', 'Products', active === 'products' || active === 'product') +
                navLink('#/about', 'About Us', active === 'about') +
                navLink('#/contact', 'Contact', active === 'contact') +
              '</nav>' +
              '<div class="nav-actions">' +
                '<button class="nav-action is-disabled" type="button" data-disabled-link data-disabled-message="Login belum tersedia buat masa ini." data-tooltip="Login is not available yet." aria-disabled="true" aria-label="Login (coming soon)">' + icon('user') + '</button>' +
                '<a class="nav-action" href="#/cart" aria-label="Cart" title="Cart">' + icon('cart') + '</a>' +
              '</div>' +
              '<button class="menu-toggle" type="button" data-action="toggle-menu" aria-controls="mobile-navigation" aria-label="' + (state.menuOpen ? 'Close menu' : 'Open menu') + '" aria-expanded="' + (state.menuOpen ? 'true' : 'false') + '"><span class="menu-toggle-glyph' + (state.menuOpen ? ' is-open' : '') + '" aria-hidden="true"><span></span><span></span><span></span></span></button>' +
            '</div>' +
            '<nav id="mobile-navigation" class="mobile-menu' + (state.menuOpen ? ' is-open' : '') + '" aria-label="Mobile navigation" aria-hidden="' + (state.menuOpen ? 'false' : 'true') + '">' +
              navLink('#/', 'Home', active === 'home') +
              navLink('#/products', 'Products', active === 'products' || active === 'product') +
              navLink('#/about', 'About Us', active === 'about') +
              navLink('#/contact', 'Contact', active === 'contact') +
              '<button class="mobile-menu-utility is-disabled" type="button" data-disabled-link data-disabled-message="Login belum tersedia buat masa ini." aria-disabled="true"><span>Login</span><small>Coming soon</small></button>' +
              '<a class="mobile-menu-utility' + (active === 'cart' ? ' is-active' : '') + '" href="#/cart"><span>Cart</span></a>' +
            '</nav>' +
          '</header>' +
          '<button class="mobile-menu-backdrop' + (state.menuOpen ? ' is-open' : '') + '" type="button" data-action="close-menu" aria-label="Close menu"></button>';
      }

      function navLink(href, label, isActive) {
        return '<a class="nav-link' + (isActive ? ' is-active' : '') + '" href="' + href + '"' + (isActive ? ' aria-current="page"' : '') + '>' + escapeHtml(label) + '</a>';
      }

      function getVisitorCount() {
        if (visitorCount !== null) return visitorCount;
        try {
          var key = config.visitorCounter.storageKey;
          visitorCount = Number(window.localStorage.getItem(key) || 0) + 1;
          window.localStorage.setItem(key, String(visitorCount));
        } catch (error) {
          visitorCount = '—';
        }
        return visitorCount;
      }

                '</div>' +
              '</div>' +
              '<div class="footer-column"><h2>Explore</h2><div class="footer-links">' +

            '<div class="footer-bottom"><span>© 2026 AMF Mart. All rights reserved.</span><span class="footer-policy-links"><span class="footer-policy-item">Terms &amp; Conditions</span><span class="footer-policy-divider">|</span><span class="footer-policy-item">Privacy Policy</span></span></div>' +

      function socialLink(name, href, label) {
        var className = 'social-link social-link-' + name;
        if (!href) return '<button class="' + className + ' is-disabled" type="button" disabled aria-label="' + escapeHtml(label) + ' unavailable">' + brandIcon(name) + '</button>';
        return '<a class="' + className + '" href="' + escapeHtml(href) + '" target="_blank" rel="noopener" aria-label="' + escapeHtml(label) + '">' + brandIcon(name) + '</a>';
      }

      function locationLink() {
        var mapUrl = getMapUrl();
        if (!mapUrl) return '<button class="footer-link-button" type="button" disabled>View on Google Maps</button>';
        return '<a href="' + escapeHtml(mapUrl) + '" target="_blank" rel="noopener">View on Google Maps</a>';
      }

      function renderRoute(options) {
        options = options || {};
        if (catalogueUpdateFrame) {
          window.cancelAnimationFrame(catalogueUpdateFrame);
          catalogueUpdateFrame = 0;
        }
        var route = routeInfo();
        var view = '';
        /* Static pages must work even when catalogue.json is unavailable. */
        if (route.name === 'cart') {
          view = renderCart();
        } else if (route.name === 'about') {
          view = renderAbout();
        } else if (route.name === 'contact') {
          view = renderContact();
        } else if (['home', 'products', 'product'].indexOf(route.name) === -1) {
          view = renderNotFound();
        } else if (!state.catalog) {
          view = state.error ? renderLoadError() : '<div class="loading-state" role="status" aria-live="polite"><span class="loading-spinner" aria-hidden="true"></span><span class="loading-text">Loading catalogue…</span></div>';
        } else if (route.name === 'home') {
          view = renderHome();
        } else if (route.name === 'products') {
          view = renderProducts();
        } else {
          view = renderProductDetail(route.slug);
        }
        app.innerHTML = renderHeader(route) + '<main id="main-content" tabindex="-1">' + view + '</main>' + renderFooter();
        applyRouteMetadata(route);
        bindAfterRender();
        setupMotion();
        if (options.focus !== false) {
          window.scrollTo(0, 0);
          window.setTimeout(function () {
            var main = document.getElementById('main-content');
            if (main) main.focus({ preventScroll: true });
          }, 0);
        }
        if (options.scrollTo === 'catalogue-top') window.setTimeout(scrollToCatalogueTop, 0);
      }

      function applyRouteMetadata(route) {
        var base = config.site.title || config.store.name || 'AMF Mart';
        var labels = { home: '', products: 'Products', cart: 'Cart', about: 'About Us', contact: 'Contact' };
        var title = Object.prototype.hasOwnProperty.call(labels, route.name) ? labels[route.name] : 'Page Not Found';
        var summary = config.site.description || 'Electrical products and accessories at AMF Mart.';
        if (route.name === 'product' && state.catalog) {
          var match = state.catalog.products.find(function (product) { return product.slug === route.slug; });
          title = match ? match.name : 'Product Not Found';
          if (match) summary = match.short_description || match.description || summary;
        } else if (route.name === 'products') {
          summary = 'Browse lighting, fans, cables, switches and more electrical products at AMF Mart.';
        } else if (route.name === 'contact') {
          summary = 'Contact AMF Mart for electrical product enquiries, opening hours and store details.';
        }
        document.title = title ? title + ' | ' + base : base;
        var description = document.getElementById('site-description');
        if (description) description.content = String(summary).slice(0, 160);
      }

      function scrollToCatalogueTop() {
        var catalogueLayout = document.querySelector('.catalogue-layout');
        if (!catalogueLayout) return;
        var breadcrumb = document.querySelector('.breadcrumb-only');
        var breadcrumbBottom = breadcrumb ? breadcrumb.getBoundingClientRect().bottom : 0;
        var desiredTop = breadcrumbBottom + 26;
        var correction = catalogueLayout.getBoundingClientRect().top - desiredTop;

      function renderProductCard(product) {

            '<section aria-labelledby="catalogue-results-heading"><div class="catalogue-topbar"><div class="search-wrap">' + icon('search') + '<label class="sr-only" for="product-search">Search products</label><input class="search-input" id="product-search" data-product-search type="search" value="' + escapeHtml(state.filters.query) + '" placeholder="Search products..." autocomplete="off"></div>' + renderSortDropdown() + '</div>' +

      function mobileSortLabelValue(value) {
        if (value === 'name-asc') return 'A–Z';

        return 'Relevance';

      function renderMobileCatalogueTools() {
        var options = [
          { value: 'relevance', label: 'Relevance' },
          { value: 'name-asc', label: 'Name A–Z' },
          { value: 'name-desc', label: 'Name Z–A' }
        ];

          '<button class="amf-sort-backdrop" type="button" data-action="dismiss-mobile-sort" aria-label="Close sort choices"></button>' +
          '<section class="amf-sort-sheet" id="amf-sort-sheet" aria-label="Sort options">' +

          }).join('') + '</section></div>';

      function renderCatalogueResults() {
        var filtered = filteredProducts();
        var pageSize = 12;
        var totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
        if (state.page > totalPages) state.page = totalPages;
        var visible = filtered.slice((state.page - 1) * pageSize, state.page * pageSize);
        return renderActiveFilters() +
          '<div class="result-bar"><span id="catalogue-results-heading">Catalogue Results</span><span><strong>' + filtered.length + '</strong> product' + (filtered.length === 1 ? '' : 's') + '</span></div>' +
          (visible.length ? '<div class="product-grid">' + visible.map(renderProductCard).join('') + '</div>' + pagination(totalPages) : renderNoProducts());
      }

      function syncCatalogueControls(options) {
        options = options || {};
        if (options.refreshFilters) {
          var filterPanel = document.querySelector('.filter-panel');
          if (filterPanel) {
            var existingScroller = filterPanel.querySelector('.filter-scroll-content');
            var filterScrollTop = existingScroller ? existingScroller.scrollTop : filterPanel.scrollTop;
            var oldContent = filterPanel.querySelector('.filter-card-combined');
            if (oldContent) oldContent.outerHTML = renderFilters();
            var nextScroller = filterPanel.querySelector('.filter-scroll-content');
            if (nextScroller) nextScroller.scrollTop = filterScrollTop;
          }
        }
        document.querySelectorAll('[data-product-search]').forEach(function (searchInput) {
          if (searchInput.value !== state.filters.query) searchInput.value = state.filters.query;
        });
        document.querySelectorAll('[data-filter-category]').forEach(function (option) {
          var selected = state.filters.category === (option.dataset.filterCategory || 'all');
          option.classList.toggle('is-active', selected);
          option.setAttribute('aria-pressed', selected ? 'true' : 'false');
        });
        document.querySelectorAll('[data-brand-filter]').forEach(function (checkbox) {
          checkbox.checked = state.filters.brands.indexOf(checkbox.dataset.brandFilter) !== -1;
        });
        var brandTriggerLabel = document.querySelector('[data-brand-filter-trigger] .filter-trigger-label');
        if (brandTriggerLabel) {
          var selectedBrands = state.filters.brands.map(function (brandId) {
            return (state.catalog.brands || []).find(function (brand) { return brand.id === brandId; });
          }).filter(Boolean);
          brandTriggerLabel.textContent = selectedBrands.length === 0 ? 'All brands' : (selectedBrands.length === 1 ? selectedBrands[0].name : selectedBrands.length + ' brands selected');
        }
        document.querySelectorAll('.sort-trigger-label').forEach(function (label) { label.textContent = sortLabel(state.filters.sort); });
        document.querySelectorAll('[data-sort-trigger]').forEach(function (trigger) { trigger.setAttribute('aria-label', 'Sort products: ' + sortLabel(state.filters.sort)); });
        var mobileSortLabel = document.querySelector('.amf-sort-label');
        if (mobileSortLabel) mobileSortLabel.textContent = mobileSortLabelValue(state.filters.sort);
        var mobileSortTrigger = document.querySelector('[data-action="toggle-mobile-sort"]');
        if (mobileSortTrigger) mobileSortTrigger.setAttribute('aria-label', 'Sort products: ' + sortLabel(state.filters.sort));
        document.querySelectorAll('[data-mobile-sort-value]').forEach(function (option) {
          var active = option.dataset.mobileSortValue === state.filters.sort;
          option.classList.toggle('is-active', active);
          option.setAttribute('aria-pressed', active ? 'true' : 'false');
          option.textContent = sortLabel(option.dataset.mobileSortValue);
        });
        document.querySelectorAll('[data-sort-value]').forEach(function (option) {
          var isActive = state.filters.sort === option.dataset.sortValue;
          option.classList.toggle('is-active', isActive);
          option.setAttribute('aria-selected', isActive ? 'true' : 'false');
        });
        var technicalKeyLabel = document.querySelector('[data-filter-dropdown-kind="tech-key-trigger"] .filter-trigger-label');
        var technicalValueLabel = document.querySelector('[data-filter-dropdown-kind="tech-value-trigger"] .filter-trigger-label');
        if (technicalKeyLabel) technicalKeyLabel.textContent = state.filters.techKey ? formatLabel(state.filters.techKey) : 'All technical fields';
        if (technicalValueLabel) technicalValueLabel.textContent = state.filters.techValue || 'All values';
        document.querySelectorAll('[data-filter-dropdown-value]').forEach(function (option) {
          var kind = option.dataset.filterDropdownKind;
          var current = kind === 'tech-key' ? state.filters.techKey : state.filters.techValue;
          var isActive = current === (option.dataset.filterDropdownValue || '');
          option.classList.toggle('is-active', isActive);
          option.setAttribute('aria-selected', isActive ? 'true' : 'false');
          var check = option.querySelector('.filter-option-check');
          if (isActive && !check) option.insertAdjacentHTML('beforeend', '<span class="filter-option-check" aria-hidden="true">✓</span>');
          if (!isActive && check) check.remove();
        });
      }

      function updateCatalogueResults(options) {
        options = options || {};
        var results = document.getElementById('catalogue-results');
        if (!results) {
          renderRoute({ focus: false });
          return;
        }
        if (catalogueUpdateFrame) window.cancelAnimationFrame(catalogueUpdateFrame);
        var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var animate = options.animate === true && !reducedMotion;
        var applyUpdate = function () {
          results.innerHTML = renderCatalogueResults();
          syncCatalogueControls(options);
          syncCatalogueUrl();
          if (options.scrollTo === 'catalogue-top') window.setTimeout(scrollToCatalogueTop, 0);
          if (animate) window.requestAnimationFrame(function () { results.classList.remove('is-refreshing'); });
        };
        if (!animate) {
          results.classList.remove('is-refreshing');
          applyUpdate();
          return;
        }
        results.classList.add('is-refreshing');
        catalogueUpdateFrame = window.requestAnimationFrame(function () {
          catalogueUpdateFrame = 0;
          applyUpdate();
        });

            return '<button class="filter-option' + (state.filters.category === category.id ? ' is-active' : '') + '" type="button" data-filter-category="' + category.id + '">' + escapeHtml(categoryLabels[category.id] || category.name) + '</button>';

      var motionObserver = null;

      function setupMotion() {
        if (motionObserver) {
          motionObserver.disconnect();

        }

        var root = document.documentElement;
        var main = document.getElementById('main-content');
        var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!main || reducedMotion || !('IntersectionObserver' in window)) {
          root.classList.remove('motion-enabled');
          return;
        }

        var targets = [];
        function prepare(selector, className, step, cycle) {
          Array.prototype.forEach.call(main.querySelectorAll(selector), function (element, index) {
            element.classList.remove('is-revealed');
            element.classList.add(className);
            element.style.setProperty('--motion-delay', ((index % cycle) * step) + 'ms');
            targets.push(element);
          });
        }

        prepare('.home-section-heading, .brand-marquee, .detail-layout, .spec-section, .related-section, .cart-empty, .about-refined-intro-grid, .about-refined-story-copy, .about-refined-why-layout, .about-location-grid, .contact-refined-contact-grid, .empty-state', 'motion-reveal', 55, 3);
        prepare('.contact-clean-method, .contact-clean-questions-list details', 'motion-stagger', 95, 4);
        var categoryCards = main.querySelectorAll('.home-category-card');
        Array.prototype.forEach.call(categoryCards, function (element, index) {
          element.classList.remove('is-revealed');
          element.classList.add('motion-stagger');
          var categoryColumns = window.innerWidth <= 767 ? 2 : (window.innerWidth <= 1199 ? 3 : 5);
          var row = Math.floor(index / categoryColumns);
          var column = index % categoryColumns;
          var rowOrder = row % 2 === 0 ? column : categoryColumns - 1 - column;
          element.style.setProperty('--motion-delay', ((row * categoryColumns + rowOrder) * 95) + 'ms');
          targets.push(element);
        });
        prepare('.home-featured-section .product-card, .related-grid .product-card', 'motion-card-reveal', 95, 5);
        prepare('.catalogue-layout .product-card', 'motion-card-reveal', 95, 4);

        if (!targets.length) {
          root.classList.remove('motion-enabled');
          return;
        }

        root.classList.add('motion-enabled');
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            entry.target.classList.add('is-revealed');
            observer.unobserve(entry.target);
          });
        }, { threshold: .1, rootMargin: '0px 0px -8% 0px' });

        motionObserver = observer;
        targets.forEach(function (target) { observer.observe(target); });
      }

            var recipient = config.contact.email.href || 'mailto:' + (config.contact.email.display || '');
            var status = document.getElementById('contact-form-status');
            if (!recipient.startsWith('mailto:') || !recipient.slice(7).trim()) {
              if (status) status.textContent = 'Email kedai belum dikonfigurasi. Sila hubungi kami melalui WhatsApp atau telefon.';
              return;
            }
            var subject = encodeURIComponent(data.get('subject') || 'AMF Mart enquiry');
            var body = encodeURIComponent('Name: ' + (data.get('name') || '') + '\nEmail: ' + (data.get('email') || '') + '\n\n' + (data.get('message') || ''));
            var separator = recipient.indexOf('?') === -1 ? '?' : '&';
            if (status) status.textContent = 'Email app akan dibuka. Tekan Send dalam aplikasi e-mel untuk menghantar mesej.';
            window.location.href = recipient + separator + 'subject=' + subject + '&body=' + body;
          });
        }
        var filterPanel = document.querySelector('.filter-panel');
        if (filterPanel) {
          // Capture scroll events from the inner scroller, including after re-render.
          filterPanel.addEventListener('scroll', repositionOpenFilterDropdowns, true);
          if (filterPanel.classList.contains('is-open')) sizeFilterPanel();
        }
      }

      function closeCustomDropdowns() {
        document.querySelectorAll('[data-sort-dropdown].is-open, [data-filter-dropdown].is-open').forEach(function (dropdown) {
          dropdown.classList.remove('is-open');
          dropdown.classList.remove('opens-up');
          var trigger = dropdown.querySelector('[data-sort-trigger], [data-filter-trigger]');
          if (trigger) trigger.setAttribute('aria-expanded', 'false');
        });
      }

      /* V8: drawer changes are drafts until Apply. Restore on X/backdrop/Escape. */
      function cloneCatalogueFilters(filters) {
        return Object.assign({}, filters, { brands: filters.brands.slice() });
      }
      function isFilterDraft() {
        return Boolean(state.filterOpen && filterDraftSnapshot && window.matchMedia('(max-width: 1199px)').matches);
      }
      function refreshDraftFilterControls(refresh) {
        syncCatalogueControls({ refreshFilters: Boolean(refresh) });
      }
      function updateCatalogueOverlayLock() {
        document.documentElement.classList.toggle('amf-catalogue-modal-open', state.filterOpen || mobileSortOpen);
      }
      function sizeFilterPanel() {
        var panel = document.querySelector('.products-page .filter-panel');
        if (panel) panel.style.maxHeight = '';
      }
      window.addEventListener('resize', sizeFilterPanel);

      function openFilterPanel(trigger) {
        if (state.filterOpen || window.innerWidth >= 1200) return;
        if (mobileSortOpen) closeMobileSort();
        filterDraftSnapshot = { filters: cloneCatalogueFilters(state.filters), page: state.page };
        overlayReturnFocus = trigger || document.querySelector('.amf-mobile-control-row [data-action="toggle-filters"]');
        state.filterOpen = true;
        var panel = document.querySelector('.products-page .filter-panel');
        if (panel) {
          panel.classList.add('is-open');
          panel.setAttribute('role', 'dialog');
          panel.setAttribute('aria-modal', 'true');
          panel.setAttribute('aria-labelledby', 'amf-filter-heading');
        }
        var backdrop = document.querySelector('.amf-filter-backdrop');
        if (backdrop) backdrop.classList.add('is-open');
        document.querySelectorAll('[data-action="toggle-filters"]').forEach(function (button) { button.setAttribute('aria-expanded', 'true'); });
        updateCatalogueOverlayLock();
        var close = document.querySelector('.amf-drawer-close');
        if (close) close.focus({ preventScroll: true });
      }
      function closeFilterPanel(applyChanges) {
        if (!state.filterOpen) return;
        var shouldApply = Boolean(applyChanges);
        if (!shouldApply && filterDraftSnapshot) {
          state.filters = cloneCatalogueFilters(filterDraftSnapshot.filters);
          state.page = filterDraftSnapshot.page;
        }
        filterDraftSnapshot = null;
        state.filterOpen = false;
        closeCustomDropdowns();
        var panel = document.querySelector('.products-page .filter-panel');
        if (panel) {
          panel.classList.remove('is-open');
          panel.removeAttribute('role');
          panel.removeAttribute('aria-modal');
          panel.removeAttribute('aria-labelledby');
        }
        var backdrop = document.querySelector('.amf-filter-backdrop');
        if (backdrop) backdrop.classList.remove('is-open');
        document.querySelectorAll('[data-action="toggle-filters"]').forEach(function (button) { button.setAttribute('aria-expanded', 'false'); });
        updateCatalogueOverlayLock();
        if (shouldApply) updateCatalogueResults({ refreshFilters: true });
        else refreshDraftFilterControls(true);
        if (overlayReturnFocus && overlayReturnFocus.isConnected) overlayReturnFocus.focus({ preventScroll: true });
        overlayReturnFocus = null;
      }
      function openMobileSort(trigger) {
        if (mobileSortOpen || window.innerWidth > 560) return;
        if (state.filterOpen) closeFilterPanel(false);
        mobileSortOpen = true;
        overlayReturnFocus = trigger || document.querySelector('[data-action="toggle-mobile-sort"]');
        var sheet = document.getElementById('amf-sort-sheet');
        if (sheet) { sheet.classList.add('is-open'); sheet.setAttribute('role', 'dialog'); sheet.setAttribute('aria-modal', 'true'); }
        var backdrop = document.querySelector('.amf-sort-backdrop');
        if (backdrop) backdrop.classList.add('is-open');
        var button = document.querySelector('[data-action="toggle-mobile-sort"]');
        if (button) button.setAttribute('aria-expanded', 'true');
        updateCatalogueOverlayLock();
        var focusTarget = window.innerWidth <= 767 ? document.querySelector('.amf-sheet-option.is-active') || document.querySelector('.amf-sheet-option') : document.querySelector('.amf-sheet-close');
        if (focusTarget) focusTarget.focus({ preventScroll: true });
      }
      function closeMobileSort() {
        if (!mobileSortOpen) return;
        mobileSortOpen = false;
        var sheet = document.getElementById('amf-sort-sheet');
        if (sheet) { sheet.classList.remove('is-open'); sheet.removeAttribute('role'); sheet.removeAttribute('aria-modal'); }
        var backdrop = document.querySelector('.amf-sort-backdrop');
        if (backdrop) backdrop.classList.remove('is-open');
        var button = document.querySelector('[data-action="toggle-mobile-sort"]');
        if (button) button.setAttribute('aria-expanded', 'false');
        updateCatalogueOverlayLock();
        if (overlayReturnFocus && overlayReturnFocus.isConnected) overlayReturnFocus.focus({ preventScroll: true });
        overlayReturnFocus = null;
      }

      function positionFilterDropdown(dropdown, trigger) {
        if (!dropdown || !trigger) return;
        var options = dropdown.querySelector('.filter-options');
        if (!options) return;
        var triggerRect = trigger.getBoundingClientRect();
        var optionsHeight = options.getBoundingClientRect().height;
        var availableAbove = triggerRect.top - 12;
        var availableBelow = window.innerHeight - triggerRect.bottom - 12;
        var shouldOpenUp = availableBelow < optionsHeight + 8 && availableAbove >= optionsHeight + 8;
        dropdown.classList.toggle('opens-up', shouldOpenUp);
      }

      function repositionOpenFilterDropdowns() {
        document.querySelectorAll('[data-filter-dropdown].is-open').forEach(function (dropdown) {
          positionFilterDropdown(dropdown, dropdown.querySelector('[data-filter-trigger]'));
        });
      }
      function revealFilterDropdownInPanel(dropdown) {
        if (!dropdown) return;
        var panel = dropdown.closest('.filter-panel');
        var scroller = panel ? panel.querySelector('.filter-scroll-content') : null;
        var options = dropdown.querySelector('.filter-options');
        if (!panel || !scroller || !options) return;
        window.requestAnimationFrame(function () {
          var scrollerRect = scroller.getBoundingClientRect();
          var triggerRect = dropdown.getBoundingClientRect();
          var optionsRect = options.getBoundingClientRect();
          var padding = 14;
          if (optionsRect.bottom > scrollerRect.bottom - padding) {
            scroller.scrollTop += optionsRect.bottom - (scrollerRect.bottom - padding) + 8;
          } else if (triggerRect.top < scrollerRect.top + padding) {
            scroller.scrollTop -= (scrollerRect.top + padding) - triggerRect.top + 8;
          }
        });
      }

      window.addEventListener('resize', repositionOpenFilterDropdowns);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', repositionOpenFilterDropdowns);

      /* Touch/stylus feedback is transient, unlike mouse hover. Use delegation
         because the app re-renders DOM when routes and catalogue results change. */
      var touchPressElement = null;
      var touchPressTimer = 0;
      var touchPressSelector = '.home-category-card, .product-card, .btn, .page-button, .menu-toggle, .nav-link, .nav-action, .social-link, .contact-clean-method, .mobile-menu-utility, .filter-toggle, .filter-trigger, .sort-trigger, .filter-option, .filter-menu-option, .sort-option, .floating-whatsapp, .text-link';
      document.addEventListener('pointerdown', function (event) {
        if (event.pointerType !== 'touch' && event.pointerType !== 'pen') return;
        var tooltip = event.target.closest('[data-tooltip]');
        if (tooltip) showExistingTooltip(tooltip);
        var element = event.target.closest(touchPressSelector);
        if (!element || element.disabled || element.getAttribute('aria-disabled') === 'true') return;
        window.clearTimeout(touchPressTimer);
        if (touchPressElement && touchPressElement !== element) touchPressElement.classList.remove('is-touch-pressed');
        touchPressElement = element;
        element.classList.add('is-touch-pressed');
      }, { passive: true });
      function endTouchPress() {
        if (!touchPressElement) return;
        var previous = touchPressElement;
        touchPressElement = null;
        window.clearTimeout(touchPressTimer);
        touchPressTimer = window.setTimeout(function () {
          previous.classList.remove('is-touch-pressed');
        }, 150);
      }
      document.addEventListener('pointerup', endTouchPress, { passive: true });
      document.addEventListener('pointercancel', endTouchPress, { passive: true });

      /* Use the exact tooltip already present on desktop for touch as well.
         No extra toast, duplicate tooltip markup or bottom-of-screen notice. */
      var existingTooltipTimer = 0;
      var existingTooltipTarget = null;
      function hideExistingTooltip() {
        window.clearTimeout(existingTooltipTimer);
        if (existingTooltipTarget) existingTooltipTarget.classList.remove('is-tooltip-visible');
        existingTooltipTarget = null;
      }
      function showExistingTooltip(element) {
        if (!element || !element.hasAttribute('data-tooltip')) return;
        hideExistingTooltip();
        existingTooltipTarget = element;
        element.classList.add('is-tooltip-visible');
        existingTooltipTimer = window.setTimeout(hideExistingTooltip, 2500);
      }

      document.addEventListener('click', function (event) {
        if (
          state.filterOpen && window.innerWidth >= 1200 &&
          !event.target.closest('.filter-panel') &&
          !event.target.closest('.filter-toggle')
        ) closeFilterPanel(false);
        var mobileSortOption = event.target.closest('[data-mobile-sort-value]');
        if (mobileSortOption) {
          event.preventDefault();
          state.filters.sort = mobileSortOption.dataset.mobileSortValue || 'relevance';
          state.page = 1;
          closeMobileSort();
          updateCatalogueResults();
          return;
        }
        var sortOption = event.target.closest('[data-sort-value]');
        if (sortOption) {
          event.preventDefault();
          state.filters.sort = sortOption.dataset.sortValue || 'relevance';
          state.page = 1;
          closeCustomDropdowns();
          updateCatalogueResults();
          return;
        }
        var filterOption = event.target.closest('[data-filter-dropdown-value]');
        if (filterOption) {
          event.preventDefault();
          var filterKind = filterOption.dataset.filterDropdownKind;
          var filterValue = filterOption.dataset.filterDropdownValue || '';
          if (filterKind === 'tech-key') {
            state.filters.techKey = filterValue;
            state.filters.techValue = '';
          } else if (filterKind === 'tech-value') {
            state.filters.techValue = filterValue;
          }
          state.page = 1;
          closeCustomDropdowns();
          if (isFilterDraft()) refreshDraftFilterControls(filterKind === 'tech-key');
          else updateCatalogueResults({ refreshFilters: filterKind === 'tech-key' });
          return;
        }
        var customTrigger = event.target.closest('[data-sort-trigger], [data-filter-trigger]');
        if (customTrigger) {
          event.preventDefault();
          var customDropdown = customTrigger.closest('[data-sort-dropdown], [data-filter-dropdown]');
          var shouldOpen = customDropdown && !customDropdown.classList.contains('is-open');
          closeCustomDropdowns();
          if (customDropdown && shouldOpen) {
            customDropdown.classList.add('is-open');
            customTrigger.setAttribute('aria-expanded', 'true');
            if (customDropdown.matches('[data-filter-dropdown]')) {
              positionFilterDropdown(customDropdown, customTrigger);
              revealFilterDropdownInPanel(customDropdown);
            }
          }
          return;
        }
        if (!event.target.closest('[data-sort-dropdown], [data-filter-dropdown]')) closeCustomDropdowns();
        var disabledLink = event.target.closest('[data-disabled-link]');
        if (disabledLink) {
          event.preventDefault();
          showExistingTooltip(disabledLink);
          return;
        }
        if (
          state.menuOpen &&
          !event.target.closest('.mobile-menu') &&
          !event.target.closest('.menu-toggle')
        ) {
          setMenuState(false);
          return;
        }
        var mobileNavLink = event.target.closest('.mobile-menu a[href]');
        if (mobileNavLink) {
          setMenuState(false);
          if (mobileNavLink.getAttribute('href') === window.location.hash) {
            event.preventDefault();
          }
        }
        var target = event.target.closest('[data-action], [data-filter-category], [data-page]');
        if (!target) return;
        if (target.dataset.action === 'toggle-menu') {
          event.preventDefault();
          setMenuState(!state.menuOpen);
        } else if (target.dataset.action === 'close-menu') {
          event.preventDefault();
          setMenuState(false);
        } else if (target.dataset.action === 'toggle-filters') {
          event.preventDefault();
          if (state.filterOpen) closeFilterPanel(false);
          else openFilterPanel(target);
        } else if (target.dataset.action === 'dismiss-filters') {
          event.preventDefault();
          closeFilterPanel(false);
        } else if (target.dataset.action === 'apply-filters') {
          event.preventDefault();
          closeFilterPanel(true);
        } else if (target.dataset.action === 'toggle-mobile-sort') {
          event.preventDefault();
          if (mobileSortOpen) closeMobileSort();
          else openMobileSort(target);
        } else if (target.dataset.action === 'dismiss-mobile-sort') {
          event.preventDefault();
          closeMobileSort();
        } else if (target.dataset.action === 'clear-filters') {
          event.preventDefault();
          clearFilters();
        } else if (target.dataset.action === 'remove-filter') {
          event.preventDefault();
          removeFilter(target.dataset.filterKind, target.dataset.filterValue || '');
        } else if (target.dataset.action === 'retry-catalogue') {
          event.preventDefault();
          loadCatalogue();
        } else if (target.dataset.filterCategory !== undefined) {
          event.preventDefault();
          var selectedCategory = target.dataset.filterCategory;
          state.filters.category = selectedCategory;
          state.filters.techKey = '';
          state.filters.techValue = '';
          state.page = 1;
          if (isFilterDraft()) {
            refreshDraftFilterControls(true);
            return;
          }
          closeFilterPanel(false);
          if (routeInfo().name === 'products') {
            updateCatalogueResults({ refreshFilters: true });
          } else {
            navigate(selectedCategory === 'all' ? '#/products' : '#/products?category=' + encodeURIComponent(selectedCategory));
          }
        } else if (target.dataset.page !== undefined && !target.disabled) {
          event.preventDefault();
          state.page = Number(target.dataset.page);
          updateCatalogueResults({ scrollTo: 'catalogue-top' });
        }
      });

      document.addEventListener('input', function (event) {
        if (!event.target.matches('[data-product-search]')) return;
        var query = event.target.value;
        window.clearTimeout(searchInputTimer);
        searchInputTimer = window.setTimeout(function () {
          state.filters.query = query;
          state.page = 1;
          updateCatalogueResults({ animate: false });
        }, 180);
      });

      document.addEventListener('change', function (event) {
        var target = event.target;
        if (target.id === 'sort-products') {
          state.filters.sort = target.value;
          state.page = 1;
          updateCatalogueResults();
        } else if (target.id === 'tech-key') {
          state.filters.techKey = target.value;
          state.filters.techValue = '';
          state.page = 1;
          updateCatalogueResults();
        } else if (target.id === 'tech-value') {
          state.filters.techValue = target.value;
          state.page = 1;
          updateCatalogueResults();
        } else if (target.dataset.pageInput !== undefined) {
          goToPageFromInput(target);
        } else if (target.dataset.brandFilter) {
          var brandId = target.dataset.brandFilter;
          if (target.checked && state.filters.brands.indexOf(brandId) === -1) state.filters.brands.push(brandId);
          if (!target.checked) state.filters.brands = state.filters.brands.filter(function (item) { return item !== brandId; });
          state.page = 1;
          if (isFilterDraft()) refreshDraftFilterControls(false);
          else updateCatalogueResults();
        }
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && (state.filterOpen || mobileSortOpen)) {
          event.preventDefault();
          if (mobileSortOpen) closeMobileSort();
          else closeFilterPanel(false);
          return;
        }
        if (event.key === 'Tab' && (state.filterOpen || mobileSortOpen)) {
          var modal = state.filterOpen ? document.querySelector('.filter-panel') : document.querySelector('.amf-sort-sheet');
          if (modal) {
            var focusable = Array.from(modal.querySelectorAll('button:not([disabled]), input:not([disabled]), [tabindex]:not([tabindex="-1"])'))
              .filter(function (element) { return element.getClientRects().length && getComputedStyle(element).visibility !== 'hidden'; });
            if (focusable.length) {
              var first = focusable[0], last = focusable[focusable.length - 1];
              if (event.shiftKey && (document.activeElement === first || !modal.contains(document.activeElement))) { event.preventDefault(); last.focus(); }
              else if (!event.shiftKey && (document.activeElement === last || !modal.contains(document.activeElement))) { event.preventDefault(); first.focus(); }
            }
          }
        }
        var dropdownOption = event.target.closest && event.target.closest('.sort-option, .filter-menu-option[role="option"]');
        var trigger = event.target.closest && event.target.closest('[data-sort-trigger], [data-filter-trigger]');
        if (trigger && (event.key === 'ArrowDown' || event.key === 'ArrowUp')) {
          event.preventDefault();
          var container = trigger.closest('[data-sort-dropdown], [data-filter-dropdown]');
          if (container && !container.classList.contains('is-open')) trigger.click();
          var options = Array.from(container ? container.querySelectorAll('[role="option"]') : []);
          if (options.length) (event.key === 'ArrowDown' ? options[0] : options[options.length - 1]).focus();
          return;
        }
        if (dropdownOption && ['ArrowDown', 'ArrowUp', 'Home', 'End'].indexOf(event.key) !== -1) {
          event.preventDefault();
          var siblings = Array.from(dropdownOption.parentElement.querySelectorAll('[role="option"]'));
          var index = siblings.indexOf(dropdownOption);
          if (event.key === 'Home') index = 0;
          else if (event.key === 'End') index = siblings.length - 1;
          else index = (index + (event.key === 'ArrowDown' ? 1 : -1) + siblings.length) % siblings.length;
          if (siblings[index]) siblings[index].focus();
          return;
        }
        if (event.key === 'Enter' && event.target.matches && event.target.matches('[data-page-input]')) {
          event.preventDefault();
          goToPageFromInput(event.target);
          return;
        }
        if (event.key === 'Escape') {
          var openTrigger = document.querySelector('[data-sort-dropdown].is-open [data-sort-trigger], [data-filter-dropdown].is-open [data-filter-trigger]');
          closeCustomDropdowns();
          if (openTrigger) openTrigger.focus();
          if (state.menuOpen) {
            setMenuState(false);
          }
        }
      });

      window.addEventListener('hashchange', function () {
        var nextRoute = routeInfo();
        if (nextRoute.name === 'products') readCatalogueFiltersFromRoute(nextRoute);
        state.menuOpen = false;
        state.filterOpen = false;
        filterDraftSnapshot = null;
        mobileSortOpen = false;
        document.documentElement.classList.remove('amf-catalogue-modal-open');
        document.body.classList.remove('menu-open');
        document.documentElement.classList.remove('menu-open');
        hideExistingTooltip();
        renderRoute();
      });
      window.addEventListener('resize', function () {
        if (window.innerWidth >= 1200 && state.filterOpen) closeFilterPanel(false);
        // If a phone switches to a wider layout, the inline sort replaces the sheet.
        if (window.innerWidth > 560 && mobileSortOpen) closeMobileSort();
        if (window.innerWidth > 850 && state.menuOpen) {
          setMenuState(false);
        }
      }, { passive: true });

      function loadFallbackCatalogue() {
        if (window.AMF_CATALOG_FALLBACK) return Promise.resolve(window.AMF_CATALOG_FALLBACK);
        return new Promise(function (resolve, reject) {
          var script = document.createElement('script');
          script.src = config.catalogue.fallbackPath;
          script.async = true;
          script.onload = function () {
            if (window.AMF_CATALOG_FALLBACK) resolve(window.AMF_CATALOG_FALLBACK);
            else reject(new Error('Fallback catalogue did not load'));
          };
          script.onerror = function () { reject(new Error('Fallback catalogue request failed')); };
          document.head.appendChild(script);
        });
      }

      function loadCatalogue() {
        state.error = '';
        if (!state.catalog && ['home', 'products', 'product'].indexOf(routeInfo().name) !== -1) {
          renderRoute({ focus: false });
        }
        if (window.location.protocol === 'file:') {
          loadFallbackCatalogue().then(function (catalog) {
            setCatalogue(catalog);
            renderRoute({ focus: false });
          }).catch(function () {
            clearCatalogue();
            state.error = 'fallback';
            renderRoute({ focus: false });
          });
          return;
        }
        fetch(config.catalogue.path || 'catalogue/catalog.json')
          .then(function (response) {
            if (!response.ok) throw new Error('Catalogue request failed');
            return response.json();
          })
          .then(function (catalog) {
            setCatalogue(catalog);
            renderRoute({ focus: false });
          })
          .catch(function () {
            loadFallbackCatalogue().then(function (catalog) {
              setCatalogue(catalog);
              renderRoute({ focus: false });
            }).catch(function () {
              clearCatalogue();
              state.error = 'catalogue';
              renderRoute({ focus: false });
            });
          });
      }

      readCatalogueFiltersFromRoute(routeInfo());
      /* Render static routes immediately; the catalogue loads independently. */
      if (['about', 'contact', 'cart'].indexOf(routeInfo().name) !== -1 || ['home', 'products', 'product'].indexOf(routeInfo().name) === -1) {
        renderRoute({ focus: false });
      }
      loadCatalogue();
    }());
  </script>
</body>
</html>
