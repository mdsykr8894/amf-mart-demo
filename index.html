<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta id="site-description" name="description" content="AMF Mart electrical product catalogue for home use, technical work and business needs.">
  <title>AMF Mart</title>
  <link id="site-favicon" rel="icon" type="image/png" href="assets/logo/electrical-shop-black%20-%20Copy.png">
  <link id="site-apple-touch-icon" rel="apple-touch-icon" href="assets/logo/electrical-shop-black%20-%20Copy.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <style>
    /* ================================================================
       Theme tokens — edit this block for global visual changes.
       ================================================================ */
    :root {
      /* Colour */
      --color-ink: #181A20;
      --color-text: #181A20;
      --color-muted: #6B7280;
      --color-muted-strong: #3F4652;
      --color-muted-faint: #9AA1AC;
      --color-brand: #FF595B;
      --color-brand-hover: #E74D50;
      --color-brand-border: #FFB4B6;
      --color-focus-ring: rgba(255, 89, 91, .22);
      --color-surface: #FFFFFF;
      --color-canvas: #FBFCFD;
      --color-subtle: #F5F6F8;
      --color-brand-soft: #FFF0F0;
      --color-brand-tint: #FFF8F8;
      --color-state-hover-surface: var(--color-subtle);
      --color-state-active-surface: var(--color-brand-soft);
      --color-state-active-border: var(--color-brand);
      --color-border: #E5E7EB;
      --color-border-soft: #F1F2F4;
      --color-border-control: #D9DEE6;
      --color-success: #1F8A5B;
      --color-whatsapp: #27C166;
      --color-whatsapp-hover: #18AE5B;
      --color-facebook: #1877F2;
      --color-tiktok: #2B2B31;
      --color-tiktok-border: #73737B;
      --color-on-dark: #F7F8FA;
      --color-on-dark-strong: rgba(247,248,250,.82);
      --color-on-dark-muted: rgba(247,248,250,.68);
      --color-on-dark-subtle: rgba(247,248,250,.55);
      --color-on-dark-disabled: rgba(247,248,250,.38);

      /* Typography */
      --font-sans: 'Manrope', Arial, sans-serif;
      --font-size-body: 16px;
      --font-size-label: 12px;
      --font-size-button: 14px;
      --font-size-page-title: clamp(30px, 3.6vw, 44px);
      --font-size-section-title: clamp(22px, 3vw, 30px);
      --line-height-body: 1.55;
      --line-height-heading: 1.15;
      --font-weight-regular: 400;
      --font-weight-medium: 500;
      --font-weight-semibold: 600;
      --font-weight-bold: 700;
      --font-weight-heading: 800;

      /* Spacing, layout and interaction */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-7: 32px;
      --space-8: 40px;
      --space-9: 48px;
      --space-section: 64px;
      --content-max: 1192px;
      --content-gutter: 28px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --control-height: 44px;
      --duration-micro: 190ms;
      --duration-standard: 280ms;
      --duration-reveal: 900ms;
      --duration-card-reveal: 780ms;
      --duration-navigation: 460ms;
      --ease-standard: cubic-bezier(.4, 0, .2, 1);
      --ease-emphasized: cubic-bezier(.22, .61, .36, 1);
      --ease-smooth: cubic-bezier(.22, .61, .36, 1);
      --transition-fast: var(--duration-micro) var(--ease-standard);
      --transition-standard: var(--duration-standard) var(--ease-standard);
      --transition-navigation: var(--duration-navigation) var(--ease-emphasized);
      --shadow-hover: 0 12px 28px rgba(27, 27, 31, .08);
      --breadcrumb-top: 110px;

      /* Legacy aliases kept while the active CSS is progressively unified. */
      --charcoal: var(--color-ink);
      --ink: var(--color-text);
      --grey: var(--color-muted);
      --red: var(--color-brand);
      --red-dark: var(--color-brand-hover);
      --white: var(--color-surface);
      --bg: var(--color-surface);
      --warm: var(--color-canvas);
      --muted: var(--color-subtle);
      --accent: var(--color-brand-soft);
      --border: var(--color-border);
      --success: var(--color-success);
      --max-width: var(--content-max);
    }

    /* Foundation */
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--color-text);
      background: var(--bg);
      font-family: var(--font-sans);
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
      overflow-x: hidden;
    }
    body.menu-open { overflow: hidden; }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; }
    img { max-width: 100%; }
    :focus-visible {
      outline: 3px solid var(--color-focus-ring);
      outline-offset: 3px;
    }
    /* Reusable utilities and interactive elements */
    .skip-link {
      position: fixed;
      z-index: 100;
      top: 12px;
      left: 12px;
      transform: translateY(-160%);
      background: var(--charcoal);
      color: var(--white);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
    }
    .skip-link:focus { transform: translateY(0); }
    .site-container {
      width: min(calc(100% - (var(--content-gutter) * 2)), var(--content-max));
      margin-inline: auto;
    }
    /* Global navigation */
    .announcement {
      background: var(--red);
      color: var(--white);
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .02em;
      transition: opacity var(--transition-standard), transform var(--transition-standard), max-height var(--transition-standard);
    }
    .announcement-inner {
      width: min(calc(100% - 56px), 1192px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-inline: auto;
    }
    .announcement-left,
    .announcement-right {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .announcement-right { text-align: right; }
    .announcement.is-hidden {
      max-height: 0;
      min-height: 0;
      padding-block: 0;
      opacity: 0;
      transform: translateY(-100%);
      overflow: hidden;
    }
    .main-nav {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    .nav-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .brand-logo { display: inline-flex; align-items: center; flex: 0 0 auto; }
    .brand-logo img { display: block; width: 132px; height: auto; }
    .nav-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex: 1;
    }
    .nav-link, .nav-action {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      position: relative;
      color: var(--charcoal);
      border: 0;
      background: transparent;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 700;
      transition: color var(--transition-fast);
    }
    .nav-link:hover, .nav-action:hover {
      color: var(--red);
      background: transparent;
    }
    .nav-link::after {
      content: "";
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: 4px;
      height: 2px;
      transform: scaleX(0);
      transform-origin: center;
      background: var(--red);
      border-radius: 99px;
      transition: transform var(--transition-navigation);
    }
    .nav-link:hover::after, .nav-link.is-active::after {
      transform: scaleX(1);
    }
    .nav-link.is-active {
      color: var(--red);
      background: transparent;
    }
    .nav-link.is-disabled,
    .nav-action.is-disabled {
      color: var(--charcoal);
      cursor: not-allowed;
      opacity: 1;
    }
    .nav-link.is-disabled:hover,
    .nav-action.is-disabled:hover {
      color: var(--red);
      background: transparent;
    }
    .nav-link.is-disabled::after { display: none; }
    .nav-action.is-disabled::after {
      content: attr(data-tooltip);
      position: absolute;
      right: calc(100% + 12px);
      top: 50%;
      padding: 8px 12px;
      transform: translateY(-50%) translateX(4px);
      color: var(--charcoal);
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 9px;
      box-shadow: 0 8px 22px rgba(27,27,31,.1);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-standard), transform var(--transition-standard);
    }
    .nav-action.is-disabled:hover::after,
    .nav-action.is-disabled:focus-visible::after {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
    }
    .nav-actions { display: flex; align-items: center; gap: 4px; }
    .menu-toggle { display: none; }
    .mobile-menu { display: none; }
    /* Icons inherit the semantic colour of their parent control or text. */
    .icon { width: 18px; height: 18px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon-fill { fill: currentColor; stroke: none; }
    main { min-height: 55vh; }
    .page-content { padding: 48px 0 88px; }
    .hero {
      padding: 0;
      background: var(--warm);
    }
    .hero .site-container {
      width: 100%;
      max-width: none;
    }
    .hero-figure {
      position: relative;
      height: clamp(360px, 36vw, 560px);
      overflow: hidden;
      border-radius: 0;
      background: var(--charcoal);
    }
    .hero-figure img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      padding: 32px;
      background: linear-gradient(90deg, rgba(27,27,29,.62), transparent 64%);
      color: var(--white);
    }
    .hero-copy { max-width: 390px; }
    .eyebrow, .section-kicker {
      color: var(--red);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .hero-copy .eyebrow { color: #FFE1E2; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { line-height: var(--line-height-heading); letter-spacing: -.02em; }
    h1 { margin-bottom: 18px; font-size: clamp(32px, 5vw, 48px); font-weight: var(--font-weight-heading); }
    h2 { margin-bottom: 14px; font-size: clamp(26px, 4vw, 32px); font-weight: var(--font-weight-heading); }
    h3 { margin-bottom: 8px; font-size: 20px; font-weight: var(--font-weight-heading); }
    .hero-copy h1 { margin-top: 8px; margin-bottom: 14px; }
    .hero-copy p { max-width: 340px; margin-bottom: 22px; color: rgba(255,255,255,.82); }
    /* Shared buttons, links, sections and product cards */
    .btn {
      min-height: var(--control-height);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-button);
      font-weight: var(--font-weight-heading);
      transition: background var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast), transform var(--transition-fast);
    }
    @media (hover: hover) and (pointer: fine) {
      .btn:hover { transform: translateY(-1px); }
    }
    .btn-primary { background: var(--red); color: var(--white); }
    .btn-primary:hover { background: var(--red-dark); }
    .btn-secondary { background: var(--white); color: var(--charcoal); border-color: var(--border); }
    .btn-secondary:hover { border-color: var(--charcoal); }
    .btn-disabled, .btn:disabled { background: var(--muted); color: var(--grey); border-color: var(--border); }
    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: var(--control-height);
      color: var(--red);
      font-size: var(--font-size-button);
      font-weight: var(--font-weight-heading);
    }
    .text-link .icon { transition: transform var(--transition-fast); }
    .text-link:hover { color: var(--red-dark); }
    @media (hover: hover) and (pointer: fine) {
      .text-link:hover .icon { transform: translateX(3px); }
    }
    .related-section {
      border-top: 1px solid var(--border);
    }
    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 26px;
    }
    .section-heading h2 { margin-bottom: 0; }
    .product-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; align-items: start; }
    .product-card {
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      cursor: pointer;
      background: var(--white);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      transition: border-color var(--transition-fast), transform var(--transition-fast);
    }
    .product-card:hover { border-color: var(--color-brand-border); }
    .product-card:focus-visible { outline: 2px solid var(--color-brand); outline-offset: 3px; }
    @media (hover: hover) and (pointer: fine) {
      .product-card:hover { transform: translateY(-2px); }
    }
    .product-card-image {
      position: relative;
      aspect-ratio: 1 / .78;
      display: grid;
      place-items: center;
      padding: 0;
      background: var(--color-canvas);
      border-bottom: 1px solid var(--border);
    }
    .product-card-image img, .detail-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .image-fallback {
      color: var(--grey);
      background: var(--muted);
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      padding: 20px;
    }
    .product-card-body { display: flex; flex-direction: column; padding: 16px; }
    .product-category { margin-bottom: 8px; color: var(--red); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .product-card h3 { min-height: 38px; margin-bottom: 0; overflow: hidden; font-size: 14px; line-height: 1.35; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .product-meta { min-height: 0; margin: 8px 0 0; color: var(--grey); font-size: 11px; line-height: 1.4; }
    .product-spec-line {
      min-height: 0;
      margin: 12px 0 0;
      color: var(--grey);
      font-size: 11px;
      line-height: 1.45;
    }
    .product-card-footer { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--color-border-soft); }
    .product-card .text-link { min-height: 30px; font-size: 12px; }
    .brand-tile {
      min-height: 86px;
      display: grid;
      place-items: center;
      padding: 14px 20px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .brand-tile img { max-width: 100%; max-height: 42px; }
    .brand-tile span { color: var(--grey); font-size: 14px; font-weight: 800; }
    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 18px;
      color: var(--grey);
      font-size: 13px;
      font-weight: 700;
    }
    .breadcrumb a:hover { color: var(--red); }
    .breadcrumb .current { color: var(--charcoal); }
    .breadcrumb-only {
      width: 100%;
      min-height: 64px;
      display: flex;
      align-items: center;
      margin: 0;
      padding-inline: 0;
      border-bottom: 1px solid var(--border);
      background: var(--white);
    }
    .breadcrumb-only .breadcrumb {
      margin-bottom: 0;
      font-size: 12px;
    }
    .breadcrumb-only > .site-container {
      width: 100%;
      max-width: 1192px;
      margin-inline: auto;
    }
    .catalogue-layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; align-items: start; margin-top: 34px; }
    .catalogue-filter-column { align-self: start; position: static; }
    .filter-panel { position: static; }
    .filter-card {
      padding: 18px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }
    .filter-card + .filter-card { margin-top: 14px; }
    .filter-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 800;
    }
    .filter-list { display: grid; gap: 3px; }
    .filter-list-scroll {
      max-height: 410px;
      overflow-y: auto;
      padding-right: 4px;
      scrollbar-gutter: stable;
    }
    .filter-option {
      width: 100%;
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--grey);
      text-align: left;
      font-size: 13px;
    }
    .filter-option:hover, .filter-option.is-active { background: var(--accent); color: var(--red); font-weight: 800; }
    .filter-option input { accent-color: var(--red); }
    .filter-clear { width: 100%; margin-top: 12px; }
    .catalogue-topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    .search-wrap { position: relative; flex: 1; }
    .search-wrap .icon { position: absolute; top: 11px; left: 13px; color: var(--grey); }
    .search-input {
      width: 100%;
      min-height: 42px;
      padding: 8px 14px 8px 42px;
      color: var(--charcoal);
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .search-input:focus { border-color: var(--red); outline: 3px solid var(--color-focus-ring); }
    .sort-wrap { min-width: 176px; }
    .result-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      color: var(--grey);
      font-size: 13px;
      font-weight: 700;
    }
    .result-bar strong { color: var(--charcoal); }
    .filter-toggle { display: none; }
    .empty-state {
      padding: 48px 24px;
      background: var(--warm);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      text-align: center;
    }
    .empty-state .empty-icon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      color: var(--red);
      background: var(--accent);
      border-radius: 50%;
    }
    .empty-state p { max-width: 460px; margin: 0 auto 20px; color: var(--grey); }
    .pagination { display: flex; flex-wrap: wrap; justify-content: center; row-gap: 10px; margin-top: 32px; }
    .pagination-wide,
    .pagination-compact { display: flex; align-items: center; gap: 8px; }
    .pagination-wide { flex-wrap: wrap; justify-content: center; }
    .pagination-compact { display: none; }
    .pagination-go {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 100%;
      justify-content: center;
      margin: 0;
      color: var(--grey);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }
    .pagination-go input {
      width: 64px;
      height: 42px;
      padding: 0 10px;
      color: var(--charcoal);
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      text-align: center;
    }
    .pagination-go input:focus {
      border-color: var(--color-brand);
      outline: none;
      box-shadow: none;
    }
    .page-button {
      width: 42px;
      min-width: 42px;
      height: 42px;
      min-height: 42px;
      display: inline-grid;
      place-items: center;
      padding: 0;
      color: var(--grey);
      background: var(--white);
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      transition: color var(--transition-fast), background-color var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
    }
    .page-button:hover:not(:disabled) { color: var(--red); background: var(--accent); }
    .page-button.is-active {
      color: var(--charcoal);
      background: var(--color-brand-soft);
      border: 2px solid var(--red);
      box-shadow: none;
    }
    .page-button:disabled { color: var(--color-muted-faint); background: var(--color-subtle); border-color: transparent; cursor: not-allowed; }
    .page-button-icon { width: 42px; padding: 0; border-color: var(--border); }
    .page-button-icon:hover:not(:disabled) { border-color: var(--border); }
    .page-button-icon .icon { width: 17px; height: 17px; }
    .page-button-nav {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      min-width: 96px;
      padding-inline: 13px;
      gap: 6px;
      border-color: var(--border);
      white-space: nowrap;
    }
    .page-button-nav:hover:not(:disabled) { border-color: var(--border); }
    .page-button-nav .icon { width: 16px; height: 16px; }
    .pagination-ellipsis {
      width: 26px;
      color: var(--grey);
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      user-select: none;
    }

    /* Custom sort control: keeps the open menu visually consistent across browsers. */

    .sort-trigger,

      gap: 12px;
      width: 100%;
      min-height: 42px;
      padding: 8px 11px 8px 12px;

    .sort-dropdown.is-open .sort-trigger .icon,
    .filter-dropdown.is-open .filter-trigger .icon { transform: rotate(180deg); }
    .sort-options,

      position: absolute;

    .sort-option,

    .sort-option:hover,

    /* Neutral hover; red is reserved for active and primary states. */
    .page-button:hover:not(:disabled),

    /* Page and scroll motion: restrained, purposeful and disabled when requested. */
    #catalogue-results {
      transition: opacity var(--duration-standard) var(--ease-smooth);
    }
    #catalogue-results.is-refreshing { opacity: .52; }
    /* Simple focus states: one clear border, with no extra ring or shadow. */
    .search-input,
    .form-field input,

    .search-input:focus,
    .form-field input:focus,

    .sort-trigger:focus-visible,

    html.motion-enabled .motion-reveal,

      transition-delay: var(--motion-delay, 0ms);

      opacity: 1;

    }
    html.motion-enabled .motion-card-reveal.is-revealed {

    @media (prefers-reduced-motion: reduce) {

      html.motion-enabled .motion-reveal,
      html.motion-enabled .motion-stagger {
        opacity: 1;
        transform: none;
        transition: none;
        will-change: auto;
      }
      html.motion-enabled .motion-card-reveal {

        transition: none;

    @media (max-width: 700px) {

    @media (max-width: 560px) {

    /* ================================================================
       Canonical responsive layout
       Desktop: 1200px+, tablet: 768–1199px, phone: below 768px.
       These rules intentionally sit last so every shared component has one
       predictable responsive contract while legacy rules are retired.
       ================================================================ */
    :root {
      --content-gutter: 28px;
      --type-body: 16px;
      --type-label: 12px;
      --type-card-title: 15px;
      --type-page-title: clamp(36px, 3.4vw, 44px);
      --type-section-title: clamp(26px, 2.5vw, 30px);
      --breadcrumb-height: 48px;
      --section-space: 64px;
    }

    body { font-size: var(--type-body); }
    .site-container,
    .announcement-inner {
      width: min(calc(100% - (var(--content-gutter) * 2)), var(--content-max));
      margin-inline: auto;
    }

    /* A fixed breadcrumb stays under the sticky navigation; the page reserves
       exactly its height, so headers never need negative margins or JS padding. */
    .page-content { padding: var(--breadcrumb-height) 0 76px; }
    .breadcrumb-only {
      position: fixed;
      inset: var(--breadcrumb-top) 0 auto;
      z-index: 25;
      width: 100%;
      min-height: var(--breadcrumb-height);
      display: flex;
      align-items: center;
      margin: 0;
      padding: 0;
      background: var(--color-surface);
      border: 0;
      border-bottom: 1px solid var(--color-border);
      box-shadow: none;
    }
    .breadcrumb-only > .site-container {
      width: min(calc(100% - (var(--content-gutter) * 2)), var(--content-max));
      max-width: var(--content-max);
      min-width: 0;
      margin-inline: auto;
      padding: 0;
    }
    .breadcrumb-only .breadcrumb {
      gap: 7px;
      margin: 0;
      font-size: var(--type-label);
      line-height: 1.3;
    }

    .standard-page-header {
      width: 100%;
      margin: 0;
      padding: 32px 0 34px;
      background: var(--color-surface);
      border: 0;
      border-radius: 0;
    }
    .standard-page-header.has-divider { border-bottom: 1px solid var(--color-border); }
    .standard-page-header h1 {
      margin: 0 0 8px;
      color: var(--color-ink);
      font-size: var(--type-page-title);
      line-height: var(--line-height-heading);
      letter-spacing: -.055em;
    }
    .standard-page-header p {
      margin: 0;
      color: var(--color-muted);
      font-size: var(--type-body);
      line-height: 1.55;
    }

    .section-heading h2,
    .home-section-heading h2,
    .about-refined-intro-copy h2,
    .contact-refined-contact-heading h2 {
      color: var(--color-ink);
      font-size: var(--type-section-title);
      line-height: var(--line-height-heading);
      letter-spacing: -.045em;
      text-transform: uppercase;
    }

    /* One desktop-navigation model: logo left, links use the available
       middle space, and utility icons remain at the right edge. */
    @media (min-width: 851px) {
      .nav-inner { justify-content: normal; }
      .nav-links { display: flex; flex: 1 1 auto; min-width: 0; }
      .nav-actions { display: flex; flex: 0 0 auto; }
    }

    /* Homepage headings use a real grid, preventing the title/link collision. */
    .home-section { padding: var(--section-space) 0; }
    .home-section-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      min-height: 38px;
      margin-bottom: 24px;
    }
    .home-section-heading h2 { grid-column: 2; }
    .home-section-heading .text-link {
      position: static;
      grid-column: 3;
      justify-self: end;
      min-height: 36px;
      font-size: var(--type-label);
    }
    .home-section-mobile-link { display: none; }

    .home-category-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
      overflow: visible;
    }
    .home-category-card {
      width: auto;
      min-width: 0;
      min-height: clamp(134px, 12vw, 158px);
      margin: 0;
      padding: 18px 12px;
    }
    .home-category-content strong { font-size: 14px; }

    .home-featured-section .product-grid,
    .related-section .related-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 18px;
      overflow: visible;
      padding: 0;
      scroll-snap-type: none;
    }
    .home-featured-section .product-card,
    .related-section .related-grid .product-card {
      width: auto;
      min-width: 0;
      max-width: none;
      margin: 0;
    }
    .home-need-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .detail-layout {
      grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr);
      gap: 42px;
      margin-top: 28px;
    }
    .detail-image { padding: 0; }

    /* Product detail has its own horizontal layout. Keep every direct layout
       boundary shrinkable so long product data never widens the page. */
    .product-detail-page,
    .product-detail-page .site-container,
    .product-detail-page .detail-layout,
    .product-detail-page .detail-panel,
    .product-detail-page .detail-image,
    .product-detail-page .spec-section,
    .product-detail-page .related-section {
      min-width: 0;
      max-width: 100%;
    }
    .product-detail-page .detail-layout { width: 100%; }

    /* Cart is deliberately a lightweight status section, not a large card. */
    .cart-empty {
      display: block;
      max-width: 560px;
      margin: 0 auto;
      padding: 52px 0 64px;
      background: transparent;
      border: 0;
      text-align: center;
    }
    .cart-empty-copy { max-width: 460px; margin: 0 auto; }
    .cart-empty .empty-icon {

    .cart-empty .empty-icon .icon { width: 23px; height: 23px; }
    .cart-empty h2 {
      margin: 0 0 10px;

    .cart-empty-copy > p {

    .cart-empty .btn { min-height: 44px; }

    .pagination {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      justify-items: center;
      gap: 10px;
      margin-top: 32px;
    }
    .pagination-wide { display: flex; }
    .pagination-compact { display: none; }
    .pagination-go { margin: 0; }

    /* A product card is one link, so pointer, touch and keyboard all use the
       same destination and focus target. */
    .product-card {
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
      color: inherit;
      text-decoration: none;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: none;
      transition: border-color var(--transition-fast), transform var(--transition-fast), background-color var(--transition-fast);
    }
    .product-card-image { display: grid; }
    .product-card-body { flex: 1 1 auto; min-width: 0; }
    .product-card-title {
      display: -webkit-box;
      min-height: 2.7em;
      overflow: hidden;
      color: var(--color-ink);
      font-size: var(--type-card-title);
      font-weight: var(--font-weight-heading);
      line-height: 1.35;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .product-meta,
    .product-spec-line {
      display: -webkit-box;
      min-height: 2.8em;
      overflow: hidden;
      line-height: 1.4;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .product-card-footer .text-link { display: inline-flex; }
    .product-card:focus-visible { outline: 2px solid var(--color-brand); outline-offset: 3px; }
    @media (hover: hover) and (pointer: fine) {
      .product-card:hover { border-color: var(--color-brand-border); background: var(--color-surface); transform: translateY(-2px); }
    }

    /* Catalogue: sidebar removes one card column; once it becomes a drawer,
       the result grid regains that column. */
    .products-page .catalogue-layout {
      grid-template-columns: 236px minmax(0, 1fr);
      gap: 28px;
      margin-top: 32px;
    }
    .products-page .catalogue-layout .product-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }
    .products-page .filter-title { font-size: 14px; }
    .products-page .filter-option { font-size: 13px; }
    .products-page .search-input { min-height: var(--control-height); font-size: var(--type-body); }

    /* Contact has one DOM order: heading, form, then alternatives. Grid areas
       place the alternatives at left on larger screens without breaking Tab. */
    .contact-refined-contact { padding: var(--section-space) 0; }
    .contact-refined-contact-grid {
      display: grid;
      grid-template-columns: minmax(0, .88fr) minmax(0, 1.12fr);
      grid-template-areas:
        'heading form'
        'methods form';
      column-gap: 72px;
      row-gap: 0;
      max-width: var(--content-max);
      margin: 0 auto;
      padding: 0;
      border: 0;
    }
    .contact-refined-contact-heading {
      grid-area: heading;
      padding-right: 24px;
    }
    .contact-refined-contact-heading h2 {
      margin: 0 0 12px;
    }
    .contact-refined-contact-heading p {
      max-width: 360px;
      margin: 0;
      color: var(--color-muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .contact-refined-contact-info {
      display: block;
      grid-area: methods;
      padding-right: 24px;
    }
    .contact-refined-contact-info .contact-clean-methods {
      margin-top: 0;
      border-top: 1px solid var(--color-border);
    }
    @media (min-width: 901px) {
      .contact-refined-contact-info .contact-clean-methods {
        margin-top: -36px;
      }
    }
    .contact-refined-contact-form {
      grid-area: form;
      padding-left: 48px;
      border-left: 1px solid var(--color-border);
    }
    .contact-refined-contact-form::before { content: none; }
    .contact-refined-contact-form .form-field label { font-size: var(--type-label); }
    .contact-refined-contact-form .form-field input,
    .contact-refined-contact-form .form-field textarea { font-size: 14px; }

    @media (max-width: 1199px) {
      :root { --content-gutter: 24px; --section-space: 56px; --type-page-title: 38px; }
      .home-category-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .home-featured-section .product-grid,
      .related-section .related-grid {
        display: flex;
        grid-template-columns: none;
        flex-wrap: nowrap;
        width: 100%;
        max-width: 100%;
        align-items: stretch;
        gap: 18px;
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        padding: 0 0 4px;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
      }
      .home-featured-section .product-grid::-webkit-scrollbar,
      .related-section .related-grid::-webkit-scrollbar { display: none; }
      .home-featured-section .product-card,
      .related-section .related-grid .product-card {
        flex: 0 0 calc((100% - 54px) / 4);
        width: calc((100% - 54px) / 4);
        min-width: calc((100% - 54px) / 4);
        align-self: stretch;
        height: auto;
        scroll-snap-align: start;
      }
      .home-featured-section .product-card-body,
      .related-section .related-grid .product-card-body {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;

      function resolveImage(src) {
        if (!src) return '';

      function getCategory(id) {
        return (state.catalog.categories || []).find(function (category) { return category.id === id; });
      }

      function categoryName(id) {
        var category = getCategory(id);
        return category ? category.name : (categoryLabels[id] || 'Other');
      }

      function shortCategoryName(id) {
        return categoryLabels[id] || categoryName(id);
      }

      function setCatalogue(catalog) {
        state.catalog = catalog;
        state.technicalFilterIndex = null;
        state.productSearchIndex = new Map((catalog.products || []).map(function (product) {
          var searchText = [product.name, product.model, product.brand, categoryLabels[product.category_id] || product.category_id]
            .concat(Object.values(product.specifications || {}))
            .join(' ')
            .toLowerCase();
          return [product.id, searchText];
        }));
      }

      function clearCatalogue() {
        state.catalog = null;
        state.technicalFilterIndex = null;
        state.productSearchIndex = null;
      }

      function renderBreadcrumb(items) {
        var parts = [];
        items.forEach(function (item, index) {
          if (index) parts.push('<span aria-hidden="true">/</span>');
          if (item.href) {
            parts.push('<a href="' + escapeHtml(item.href) + '">' + escapeHtml(item.label) + '</a>');
            return;
          }
          parts.push('<span class="current"' + (item.title ? ' title="' + escapeHtml(item.title) + '"' : '') + '>' + escapeHtml(item.label) + '</span>');
        });
        return '<div class="breadcrumb-only"><div class="site-container"><div class="breadcrumb">' + parts.join('') + '</div></div></div>';
      }

      function routeInfo() {
        var raw = (window.location.hash || '#/').slice(1) || '/';
        var split = raw.split('?');
        var path = split[0] || '/';
        var query = new URLSearchParams(split[1] || '');
        var parts = path.split('/').filter(Boolean);
        if (parts[0] === 'product' && parts[1]) return { name: 'product', slug: decodeURIComponent(parts.slice(1).join('/')), query: query };
        return { name: parts[0] || 'home', query: query };
      }

      function navigate(hash) {
        /* Re-rendering the active route replays reveal motion and resets state. */
        if (window.location.hash === hash) return;
        window.location.hash = hash;
      }

      function setMenuState(isOpen) {
        state.menuOpen = Boolean(isOpen);
        document.body.classList.toggle('menu-open', state.menuOpen);

        var toggle = document.querySelector('[data-action="toggle-menu"]');
        var glyph = toggle ? toggle.querySelector('.menu-toggle-glyph') : null;
        var menu = document.getElementById('mobile-navigation');
        var backdrop = document.querySelector('.mobile-menu-backdrop');

        if (toggle) {
          toggle.setAttribute('aria-expanded', state.menuOpen ? 'true' : 'false');
          toggle.setAttribute('aria-label', state.menuOpen ? 'Close menu' : 'Open menu');
        }
        if (glyph) glyph.classList.toggle('is-open', state.menuOpen);
        if (menu) {
          menu.classList.toggle('is-open', state.menuOpen);
          menu.setAttribute('aria-hidden', state.menuOpen ? 'false' : 'true');
        }
        if (backdrop) backdrop.classList.toggle('is-open', state.menuOpen);
      }

      function getVisitorCount() {

          window.localStorage.setItem(key, String(visitorCount));
        } catch (error) {
          visitorCount = '—';
        }
        return visitorCount;

      function renderRoute(options) {
        options = options || {};
        if (catalogueUpdateFrame) {
          window.cancelAnimationFrame(catalogueUpdateFrame);
          catalogueUpdateFrame = 0;
        }
        var route = routeInfo();
        var routeCategory = route.query.get('category');
        if (route.name === 'products' && routeCategory && state.filters.category !== routeCategory) {
          state.filters.category = routeCategory || 'all';
          state.filters.techKey = '';
          state.filters.techValue = '';
          state.page = 1;
        }
        var view = '';
        if (!state.catalog) {
          view = state.error ? renderLoadError() : '<div class="loading-state">Loading AMF Mart catalogue…</div>';
        } else if (route.name === 'home') {
          view = renderHome();
        } else if (route.name === 'products') {
          view = renderProducts();
        } else if (route.name === 'product') {
          view = renderProductDetail(route.slug);
        } else if (route.name === 'cart') {
          view = renderCart();
        } else if (route.name === 'about') {
          view = renderAbout();
        } else if (route.name === 'contact') {
          view = renderContact();
        } else {
          view = renderNotFound();
        }
        app.innerHTML = renderHeader(route) + '<main id="main-content" tabindex="-1">' + view + '</main>' + renderFooter();
        bindAfterRender();
        setupMotion();
        if (options.focus !== false) {
          window.scrollTo(0, 0);
          window.setTimeout(function () {
            var main = document.getElementById('main-content');
            if (main) main.focus({ preventScroll: true });
          }, 0);
        }
        updateAnnouncement();
        if (options.scrollTo === 'catalogue-top') window.setTimeout(scrollToCatalogueTop, 0);
      }

      function scrollToCatalogueTop() {
        var catalogueLayout = document.querySelector('.catalogue-layout');
        if (!catalogueLayout) return;
        var breadcrumb = document.querySelector('.breadcrumb-only');
        var breadcrumbBottom = breadcrumb ? breadcrumb.getBoundingClientRect().bottom : 0;
        var desiredTop = breadcrumbBottom + 26;
        var correction = catalogueLayout.getBoundingClientRect().top - desiredTop;
        window.scrollBy({ top: correction, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      }

          { title: 'Product Details', text: 'Models and specifications\nat a glance', icon: 'clipboard' },
          { title: 'Ask Us', text: 'Call or WhatsApp us\nabout a product', icon: 'messageCircle' },
          { title: 'Visit Our Store', text: 'Visit us in Kampung Raja,\nTerengganu', icon: 'pin' }
        ];
        return '<div class="hero"><div class="site-container"><figure class="hero-figure"><img src="' + escapeHtml(config.assets.homeBanner) + '" alt="' + escapeHtml(config.store.name) + ' electrical products banner" onerror="this.remove(); this.parentElement.classList.add(\'image-fallback\')"></figure></div></div>' +
          '<section class="home-need-section" aria-label="AMF Mart service highlights"><div class="site-container"><div class="home-need-grid">' + needCards.map(homeNeedCard).join('') + '</div></div></section>' +
          '<section class="home-section home-category-section"><div class="site-container"><div class="home-section-heading"><h2>SHOP BY CATEGORY</h2><a class="text-link home-section-header-link" href="#/products">VIEW ALL CATEGORIES ' + icon('arrow') + '</a></div><div class="home-category-grid">' + homeCategories.map(homepageCategoryCard).join('') + '</div><div class="home-section-link home-section-mobile-link"><a class="text-link" href="#/products">VIEW ALL CATEGORIES ' + icon('arrow') + '</a></div></div></section>' +
          '<section class="home-section home-featured-section"><div class="site-container"><div class="home-section-heading"><h2>FEATURED PRODUCTS</h2><a class="text-link home-section-header-link" href="#/products">VIEW ALL PRODUCTS ' + icon('arrow') + '</a></div><div class="product-grid">' + featured.map(renderProductCard).join('') + '</div><div class="home-section-link home-section-mobile-link"><a class="text-link" href="#/products">VIEW ALL PRODUCTS ' + icon('arrow') + '</a></div></div></section>' +
          '<section class="home-section home-brands-section"><div class="site-container"><div class="home-section-heading"><h2>SELECTED BRANDS</h2></div><div class="brand-marquee" aria-label="Selected brands"><div class="brand-marquee-track"><div class="brand-marquee-group">' + brandNames.map(brandTile).join('') + '</div><div class="brand-marquee-group" aria-hidden="true">' + brandNames.map(brandTile).join('') + '</div></div></div></div></section>';
      }

      function homepageCategoryCard(item) {
        var categoryAsset = categoryImageMap[item.id];
        var categoryMedia = categoryAsset
          ? '<img class="category-icon category-icon-normal" src="assets/category/normal/' + categoryAsset + '-normal.png" alt="" aria-hidden="true" decoding="async"><img class="category-icon category-icon-active" src="assets/category/active/' + categoryAsset + '-active.png" alt="" aria-hidden="true" decoding="async">'
          : icon(categoryIconMap[item.id] || 'grid');
        return '<a class="home-category-card" href="#/products?category=' + encodeURIComponent(item.id) + '">' +
          '<span class="home-category-media">' + categoryMedia + '</span>' +
          '<span class="home-category-content"><strong>' + escapeHtml(item.label) + '</strong></span>' +
        '</a>';
      }

      function homeNeedCard(item) {
        return '<article class="home-need-card"><span class="home-need-icon">' + icon(item.icon) + '</span><h3>' + escapeHtml(item.title) + '</h3><p>' + escapeHtml(item.text) + '</p></article>';
      }

      function brandTile(name) {
        var file = brandAssets[name];
        if (file) return '<div class="brand-tile"><img src="assets/brand-logos/' + file + '" alt="' + escapeHtml(name) + '"></div>';
        return '<div class="brand-tile"><span>' + escapeHtml(name) + '</span></div>';
      }

      function renderProductCard(product) {
        var image = product.images && product.images[0] ? resolveImage(product.images[0].src) : '';
        var alt = product.images && product.images[0] ? product.images[0].alt : product.name;
        var productHref = '#/product/' + encodeURIComponent(product.slug);
        var meta = [];
        if (product.brand) meta.push(product.brand);
        if (product.model) meta.push(product.model);
        var spec = Object.entries(product.specifications || {})
          .filter(function (entry) { return entry[0] !== 'unit_of_measure' && entry[1] !== undefined && entry[1] !== null && String(entry[1]).trim() !== ''; })
          .slice(0, 2)
          .map(function (entry) { return formatLabel(entry[0]) + ': ' + entry[1]; })
          .join(' · ');
        return '<a class="product-card" href="' + escapeHtml(productHref) + '" aria-label="View details for ' + escapeHtml(product.name) + '">' +
          '<span class="product-card-image" aria-hidden="true">' +
            (image ? '<img src="' + escapeHtml(image) + '" alt="' + escapeHtml(alt) + '" loading="lazy" onerror="this.remove(); this.parentElement.classList.add(\'image-fallback\'); this.parentElement.textContent=\'Image unavailable\'">' : '<span class="image-fallback">Image unavailable</span>') +
          '</span>' +
          '<span class="product-card-body"><span class="product-category">' + escapeHtml(shortCategoryName(product.category_id)) + '</span><span class="product-card-title">' + escapeHtml(product.name) + '</span>' + (meta.length ? '<span class="product-meta">' + escapeHtml(meta.join(' · ')) + '</span>' : '') + (spec ? '<span class="product-spec-line">' + escapeHtml(spec) + '</span>' : '') + '<span class="product-card-footer"><span class="text-link">VIEW DETAILS ' + icon('arrow') + '</span></span></span>' +
        '</a>';
      }

      function renderPageHeader(page) {
        return '<div class="page-header standard-page-header has-divider"><div class="site-container"><h1>' + escapeHtml(page.title) + '</h1><p>' + escapeHtml(page.description) + '</p></div></div>';
      }

      function renderProducts() {
        return '<div class="page-content products-page">' + renderBreadcrumb([{ label: 'Home', href: '#/' }, { label: 'Products' }]) +
          renderPageHeader(pageHeaders.products) +
          '<div class="site-container"><div class="catalogue-layout">' +
            '<div class="catalogue-filter-column"><button class="btn btn-secondary filter-toggle" type="button" data-action="toggle-filters" aria-expanded="' + (state.filterOpen ? 'true' : 'false') + '">Filter Catalogue ' + icon('sliders') + '</button><aside class="filter-panel' + (state.filterOpen ? ' is-open' : '') + '">' + renderFilters() + '</aside></div>' +
            '<section aria-labelledby="catalogue-results-heading"><div class="catalogue-topbar"><div class="search-wrap">' + icon('search') + '<label class="sr-only" for="product-search">Search products</label><input class="search-input" id="product-search" type="search" value="' + escapeHtml(state.filters.query) + '" placeholder="Search products..." autocomplete="off"></div>' + renderSortDropdown() + '</div>' +
              '<div id="catalogue-results">' + renderCatalogueResults() + '</div>' +
            '</section>' +
          '</div></div></div>';
      }

      function renderCatalogueResults() {
        var filtered = filteredProducts();
        var pageSize = 12;
        var totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
        if (state.page > totalPages) state.page = totalPages;
        var visible = filtered.slice((state.page - 1) * pageSize, state.page * pageSize);
        return renderActiveFilters() +
          '<div class="result-bar"><span id="catalogue-results-heading">Catalogue Results</span><span><strong>' + filtered.length + '</strong> product' + (filtered.length === 1 ? '' : 's') + '</span></div>' +
          (visible.length ? '<div class="product-grid">' + visible.map(renderProductCard).join('') + '</div>' + pagination(totalPages) : renderNoProducts());
      }

      function syncCatalogueControls(options) {
        options = options || {};
        if (options.refreshFilters) {
          var filterPanel = document.querySelector('.filter-panel');
          if (filterPanel) {
            var filterScrollTop = filterPanel.scrollTop;
            filterPanel.innerHTML = renderFilters();
            filterPanel.scrollTop = filterScrollTop;
          }
        }
        document.querySelectorAll('[data-filter-category]').forEach(function (option) {
          option.classList.toggle('is-active', state.filters.category === (option.dataset.filterCategory || 'all'));
        });
        document.querySelectorAll('[data-brand-filter]').forEach(function (checkbox) {
          checkbox.checked = state.filters.brands.indexOf(checkbox.dataset.brandFilter) !== -1;
        });
        var brandTriggerLabel = document.querySelector('[data-brand-filter-trigger] .filter-trigger-label');
        if (brandTriggerLabel) {
          var selectedBrands = state.filters.brands.map(function (brandId) {
            return (state.catalog.brands || []).find(function (brand) { return brand.id === brandId; });
          }).filter(Boolean);
          brandTriggerLabel.textContent = selectedBrands.length === 0 ? 'All brands' : (selectedBrands.length === 1 ? selectedBrands[0].name : selectedBrands.length + ' brands selected');
        }
        var sortTriggerLabel = document.querySelector('.sort-trigger-label');
        if (sortTriggerLabel) sortTriggerLabel.textContent = sortLabel(state.filters.sort);
        document.querySelectorAll('[data-sort-value]').forEach(function (option) {
          var isActive = state.filters.sort === option.dataset.sortValue;
          option.classList.toggle('is-active', isActive);
          option.setAttribute('aria-selected', isActive ? 'true' : 'false');
          var check = option.querySelector('.sort-option-check');
          if (isActive && !check) option.insertAdjacentHTML('beforeend', '<span class="sort-option-check" aria-hidden="true">✓</span>');
          if (!isActive && check) check.remove();
        });
        var technicalKeyLabel = document.querySelector('[data-filter-dropdown-kind="tech-key-trigger"] .filter-trigger-label');
        var technicalValueLabel = document.querySelector('[data-filter-dropdown-kind="tech-value-trigger"] .filter-trigger-label');
        if (technicalKeyLabel) technicalKeyLabel.textContent = state.filters.techKey ? formatLabel(state.filters.techKey) : 'All technical fields';
        if (technicalValueLabel) technicalValueLabel.textContent = state.filters.techValue || 'All values';
        document.querySelectorAll('[data-filter-dropdown-value]').forEach(function (option) {
          var kind = option.dataset.filterDropdownKind;
          var current = kind === 'tech-key' ? state.filters.techKey : state.filters.techValue;
          var isActive = current === (option.dataset.filterDropdownValue || '');
          option.classList.toggle('is-active', isActive);
          option.setAttribute('aria-selected', isActive ? 'true' : 'false');
          var check = option.querySelector('.filter-option-check');
          if (isActive && !check) option.insertAdjacentHTML('beforeend', '<span class="filter-option-check" aria-hidden="true">✓</span>');
          if (!isActive && check) check.remove();
        });
      }

      function updateCatalogueResults(options) {
        options = options || {};
        var results = document.getElementById('catalogue-results');
        if (!results) {
          renderRoute({ focus: false });
          return;
        }
        if (catalogueUpdateFrame) window.cancelAnimationFrame(catalogueUpdateFrame);
        var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var animate = options.animate === true && !reducedMotion;
        var applyUpdate = function () {
          results.innerHTML = renderCatalogueResults();
          syncCatalogueControls(options);
          if (options.scrollTo === 'catalogue-top') window.setTimeout(scrollToCatalogueTop, 0);
          if (animate) window.requestAnimationFrame(function () { results.classList.remove('is-refreshing'); });
        };
        if (!animate) {
          results.classList.remove('is-refreshing');
          applyUpdate();
          return;
        }
        results.classList.add('is-refreshing');
        catalogueUpdateFrame = window.requestAnimationFrame(function () {
          catalogueUpdateFrame = 0;
          applyUpdate();
        });
      }

      function renderBrandFilterDropdown(brands) {
        var selectedBrands = state.filters.brands.map(function (brandId) {
          return brands.find(function (brand) { return brand.id === brandId; });
        }).filter(Boolean);
        var selectedLabel = selectedBrands.length === 0 ? 'All brands' : (selectedBrands.length === 1 ? selectedBrands[0].name : selectedBrands.length + ' brands selected');
        return '<div class="filter-dropdown filter-brand-dropdown" data-filter-dropdown>' +
          '<button class="filter-trigger" type="button" data-filter-trigger data-brand-filter-trigger aria-haspopup="listbox" aria-expanded="false" aria-controls="brand-filter-options" aria-label="Brand filter"><span class="filter-trigger-label">' + escapeHtml(selectedLabel) + '</span>' + icon('chevronDown') + '</button>' +
          '<div class="filter-options filter-brand-options" id="brand-filter-options" role="group" aria-label="Brands">' + brands.map(function (brand) {
            var checked = state.filters.brands.indexOf(brand.id) !== -1;
            return '<label class="filter-menu-option filter-brand-option"><span class="filter-brand-option-label"><input type="checkbox" data-brand-filter="' + escapeHtml(brand.id) + '"' + (checked ? ' checked' : '') + '><span>' + escapeHtml(brand.name) + '</span></span></label>';
          }).join('') + '</div>' +
        '</div>';
      }

      function renderFilters() {
        var categories = state.catalog.categories || [];
        var brands = state.catalog.brands || [];
        var technical = technicalOptions();
        var technicalMarkup = technical.keys.length ? '<div class="filter-section filter-technical-section"><div class="filter-title"><span>Technical Filters</span></div>' + renderFilterDropdown('tech-key', 'tech-key', state.filters.techKey, [{ value: '', label: 'All technical fields' }].concat(technical.keys.map(function (key) { return { value: key, label: formatLabel(key) }; })), 'Technical field') + (state.filters.techKey ? renderFilterDropdown('tech-value', 'tech-value', state.filters.techValue, [{ value: '', label: 'All values' }].concat(technical.values.map(function (value) { return { value: value, label: value }; })), 'Technical value') : '') + '</div>' : '';
        return '<div class="filter-card filter-card-combined">' +
          '<div class="filter-section filter-category-section"><div class="filter-title"><span>Categories</span></div><div class="filter-list filter-list-scroll filter-category-list"><button class="filter-option' + (state.filters.category === 'all' ? ' is-active' : '') + '" type="button" data-filter-category="all">All Products</button>' + categories.map(function (category) {
            return '<button class="filter-option' + (state.filters.category === category.id ? ' is-active' : '') + '" type="button" data-filter-category="' + category.id + '">' + escapeHtml(categoryLabels[category.id] || category.name) + '</button>';
          }).join('') + '</div></div>' +
          '<div class="filter-section filter-brand-section"><div class="filter-title"><span>Brands</span></div>' + renderBrandFilterDropdown(brands) + '</div>' +
          technicalMarkup +
          '<button class="btn btn-secondary filter-clear filter-clear-desktop" type="button" data-action="clear-filters">Clear All</button>' +
          '<div class="filter-mobile-actions"><button class="btn btn-primary" type="button" data-action="apply-filters">Apply Filters</button><button class="btn btn-secondary" type="button" data-action="clear-filters">Clear All</button></div>' +
        '</div>';
      }

      function renderActiveFilters() {
        var chips = [];
        if (state.filters.query) chips.push('<button class="filter-chip" type="button" data-action="remove-filter" data-filter-kind="query" aria-label="Remove search filter">Search: ' + escapeHtml(state.filters.query) + icon('close') + '</button>');
        if (state.filters.category !== 'all') chips.push('<button class="filter-chip" type="button" data-action="remove-filter" data-filter-kind="category" aria-label="Remove category filter">' + escapeHtml(categoryLabels[state.filters.category] || categoryName(state.filters.category)) + icon('close') + '</button>');
        state.filters.brands.forEach(function (brandId) {
          var brand = (state.catalog.brands || []).find(function (item) { return item.id === brandId; });
          if (brand) chips.push('<button class="filter-chip" type="button" data-action="remove-filter" data-filter-kind="brand" data-filter-value="' + escapeHtml(brand.id) + '" aria-label="Remove ' + escapeHtml(brand.name) + ' filter">' + escapeHtml(brand.name) + icon('close') + '</button>');
        });
        if (state.filters.techKey) chips.push('<button class="filter-chip" type="button" data-action="remove-filter" data-filter-kind="technical" aria-label="Remove technical filter">' + escapeHtml(formatLabel(state.filters.techKey)) + (state.filters.techValue ? ': ' + escapeHtml(state.filters.techValue) : '') + icon('close') + '</button>');
        if (!chips.length) return '';
        return '<div class="active-filters" aria-label="Applied filters"><span class="active-filters-label">Applied filters</span>' + chips.join('') + '<button class="filter-clear-link" type="button" data-action="clear-filters">Clear all</button></div>';
      }

      function sortLabel(value) {
        if (value === 'name-asc') return 'Name A–Z';
        if (value === 'name-desc') return 'Name Z–A';
        return 'Relevance';
      }

      function renderSortDropdown() {
        var options = [
          { value: 'relevance', label: 'Relevance' },
          { value: 'name-asc', label: 'Name A–Z' },
          { value: 'name-desc', label: 'Name Z–A' }
        ];
        return '<div class="sort-wrap"><span class="sort-label" id="sort-products-label">Sort by</span><div class="sort-dropdown" data-sort-dropdown><button class="sort-trigger" type="button" data-sort-trigger aria-haspopup="listbox" aria-expanded="false" aria-controls="sort-products-options" aria-labelledby="sort-products-label sort-products-value"><span class="sort-trigger-label" id="sort-products-value">' + escapeHtml(sortLabel(state.filters.sort)) + '</span>' + icon('chevronDown') + '</button><div class="sort-options" id="sort-products-options" role="listbox" aria-labelledby="sort-products-label">' + options.map(function (option) {
          var isActive = state.filters.sort === option.value;
          return '<button class="sort-option' + (isActive ? ' is-active' : '') + '" type="button" role="option" data-sort-value="' + option.value + '" aria-selected="' + (isActive ? 'true' : 'false') + '">' + option.label + (isActive ? '<span class="sort-option-check" aria-hidden="true">✓</span>' : '') + '</button>';
        }).join('') + '</div></div></div>';
      }

      function renderFilterDropdown(id, kind, currentValue, options, ariaLabel) {
        var activeOption = options.find(function (option) { return option.value === currentValue; }) || options[0];
        return '<div class="filter-dropdown" data-filter-dropdown><button class="filter-trigger" type="button" data-filter-trigger data-filter-dropdown-kind="' + escapeHtml(kind) + '-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="' + escapeHtml(id) + '-options" aria-label="' + escapeHtml(ariaLabel) + '"><span class="filter-trigger-label">' + escapeHtml(activeOption.label) + '</span>' + icon('chevronDown') + '</button><div class="filter-options" id="' + escapeHtml(id) + '-options" role="listbox" aria-label="' + escapeHtml(ariaLabel) + '">' + options.map(function (option) {
          var isActive = currentValue === option.value;
          return '<button class="filter-menu-option' + (isActive ? ' is-active' : '') + '" type="button" role="option" data-filter-dropdown-kind="' + escapeHtml(kind) + '" data-filter-dropdown-value="' + escapeHtml(option.value) + '" aria-selected="' + (isActive ? 'true' : 'false') + '">' + escapeHtml(option.label) + (isActive ? '<span class="filter-option-check" aria-hidden="true">✓</span>' : '') + '</button>';
        }).join('') + '</div></div>';
      }

      function formatLabel(value) {
        return String(value).replace(/_/g, ' ').replace(/\b\w/g, function (letter) { return letter.toUpperCase(); });
      }

      function technicalOptions() {
        if (!state.technicalFilterIndex) {
          var groups = { all: state.catalog.products || [] };
          (state.catalog.products || []).forEach(function (product) {
            (groups[product.category_id] = groups[product.category_id] || []).push(product);
          });
          state.technicalFilterIndex = {};
          Object.keys(groups).forEach(function (groupId) {
            var keys = {};
            var valuesByKey = {};
            groups[groupId].forEach(function (product) {
              Object.keys(product.specifications || {}).forEach(function (key) {
                keys[key] = true;
                var value = product.specifications[key];
                if (value !== undefined && value !== null && String(value).trim()) {
                  (valuesByKey[key] = valuesByKey[key] || {})[String(value)] = true;
                }
              });
            });
            state.technicalFilterIndex[groupId] = {
              keys: Object.keys(keys).sort(),
              valuesByKey: valuesByKey
            };
          });
        }
        var technical = state.technicalFilterIndex[state.filters.category] || state.technicalFilterIndex.all;
        return {
          keys: technical.keys,
          values: state.filters.techKey ? Object.keys(technical.valuesByKey[state.filters.techKey] || {}).sort() : []
        };
      }

      function filteredProducts() {
        var query = state.filters.query.trim().toLowerCase();
        var products = state.catalog.products.filter(function (product) {
          var categoryMatch = state.filters.category === 'all' || product.category_id === state.filters.category;
          var brandMatch = !state.filters.brands.length || (product.brand_ids || []).some(function (brandId) { return state.filters.brands.indexOf(brandId) !== -1; });
          var techValue = product.specifications && state.filters.techKey ? String(product.specifications[state.filters.techKey] || '') : '';
          var techMatch = !state.filters.techKey || !state.filters.techValue || techValue === state.filters.techValue;
          var searchText = state.productSearchIndex.get(product.id) || '';
          return categoryMatch && brandMatch && techMatch && (!query || searchText.indexOf(query) !== -1);
        });
        if (state.filters.sort === 'name-asc') products.sort(function (a, b) { return a.name.localeCompare(b.name); });
        if (state.filters.sort === 'name-desc') products.sort(function (a, b) { return b.name.localeCompare(a.name); });
        return products;
      }

      function pagination(totalPages) {
        if (totalPages <= 1) return '';
        var pageItems = [];
        if (totalPages <= 7) {
          for (var page = 1; page <= totalPages; page += 1) pageItems.push(page);
        } else if (state.page <= 3) {
          pageItems = [1, 2, 3];
          if (state.page === 3) pageItems.push(4);
          pageItems.push('ellipsis', totalPages);
        } else if (state.page >= totalPages - 2) {
          pageItems = [1, 'ellipsis', totalPages - 2, totalPages - 1, totalPages];
        } else {
          pageItems = [1, 'ellipsis', state.page - 1, state.page, state.page + 1, 'ellipsis', totalPages];
        }
        function renderPageItems() {
          return pageItems.map(function (item) {
            if (item === 'ellipsis') return '<span class="pagination-ellipsis" aria-hidden="true">…</span>';
            return '<button class="page-button' + (state.page === item ? ' is-active' : '') + '" type="button" data-page="' + item + '" aria-label="Page ' + item + '"' + (state.page === item ? ' aria-current="page"' : '') + '>' + item + '</button>';
          }).join('');
        }
        var wideButtons = '<button class="page-button page-button-nav" type="button" data-page="' + (state.page - 1) + '" aria-label="Previous page" title="Previous page" ' + (state.page === 1 ? 'disabled' : '') + '>' + icon('chevronLeft') + '<span>Previous</span></button>' + renderPageItems();
        wideButtons += '<button class="page-button page-button-nav" type="button" data-page="' + (state.page + 1) + '" aria-label="Next page" title="Next page" ' + (state.page === totalPages ? 'disabled' : '') + '><span>Next</span>' + icon('chevronRight') + '</button>';
        var goToPage = '<div class="pagination-go" aria-label="Go to page"><span>Go to page</span><input type="number" min="1" max="' + totalPages + '" value="' + state.page + '" data-page-input aria-label="Page number"><span>of ' + totalPages.toLocaleString() + '</span></div>';

        var compactButtons = '<button class="page-button page-button-nav" type="button" data-page="' + (state.page - 1) + '" aria-label="Previous page" title="Previous page" ' + (state.page === 1 ? 'disabled' : '') + '>' + icon('chevronLeft') + '</button>' + renderPageItems();
        compactButtons += '<button class="page-button page-button-nav" type="button" data-page="' + (state.page + 1) + '" aria-label="Next page" title="Next page" ' + (state.page === totalPages ? 'disabled' : '') + '>' + icon('chevronRight') + '</button>';
        return '<nav class="pagination" aria-label="Product pagination"><div class="pagination-wide">' + wideButtons + '</div><div class="pagination-compact">' + compactButtons + '</div>' + goToPage + '</nav>';
      }

      function goToPageFromInput(input) {
        var totalPages = Number.parseInt(input.max, 10);
        var requestedPage = Number.parseInt(input.value, 10);
        if (!Number.isFinite(totalPages) || !Number.isFinite(requestedPage)) return;
        state.page = Math.min(totalPages, Math.max(1, requestedPage));
        updateCatalogueResults({ scrollTo: 'catalogue-top' });
      }

      function renderNoProducts() {
        var hasFilters = state.filters.query || state.filters.brands.length || state.filters.techKey;
        var category = state.filters.category !== 'all' ? (categoryLabels[state.filters.category] || categoryName(state.filters.category)) : '';
        var heading = hasFilters ? 'No products match your filters.' : (category ? 'No products in ' + category + '.' : 'No products found.');
        var copy = hasFilters ? 'Try removing a filter or clear all to see more products.' : 'Try another category to continue browsing.';
        return '<div class="empty-state"><div class="empty-icon">' + icon('search') + '</div><h2>' + escapeHtml(heading) + '</h2><p>' + escapeHtml(copy) + '</p><button class="btn btn-secondary" type="button" data-action="clear-filters">Clear All Filters</button></div>';
      }

      function renderProductDetail(slug) {
        var product = state.catalog.products.find(function (item) { return item.slug === slug; });

      var motionObserver = null;

      function setupMotion() {
        if (motionObserver) {
          motionObserver.disconnect();
          motionObserver = null;
        }

        var root = document.documentElement;
        var main = document.getElementById('main-content');
        var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!main || reducedMotion || !('IntersectionObserver' in window)) {
          root.classList.remove('motion-enabled');
          return;
        }

        var targets = [];
        function prepare(selector, className, step, cycle) {
          Array.prototype.forEach.call(main.querySelectorAll(selector), function (element, index) {
            element.classList.remove('is-revealed');
            element.classList.add(className);
            element.style.setProperty('--motion-delay', ((index % cycle) * step) + 'ms');
            targets.push(element);
          });
        }

        prepare('.home-section-heading, .brand-marquee, .detail-layout, .spec-section, .related-section, .cart-empty, .about-refined-intro-grid, .about-refined-story-copy, .about-refined-why-layout, .about-location-grid, .contact-refined-contact-grid, .empty-state', 'motion-reveal', 55, 3);
        prepare('.contact-clean-method, .contact-clean-questions-list details', 'motion-stagger', 95, 4);
        var needCards = main.querySelectorAll('.home-need-card');
        Array.prototype.forEach.call(needCards, function (element, index) {
          element.classList.remove('is-revealed');
          element.classList.add('motion-stagger');
          var columns = window.innerWidth <= 1199 ? 2 : 4;
          var row = Math.floor(index / columns);
          var column = index % columns;
          var rowOrder = columns - 1 - column;
          element.style.setProperty('--motion-delay', ((row * columns + rowOrder) * 95) + 'ms');
          targets.push(element);
        });
        var categoryCards = main.querySelectorAll('.home-category-card');
        Array.prototype.forEach.call(categoryCards, function (element, index) {
          element.classList.remove('is-revealed');
          element.classList.add('motion-stagger');
          var categoryColumns = window.innerWidth <= 767 ? 2 : (window.innerWidth <= 1199 ? 3 : 5);
          var row = Math.floor(index / categoryColumns);
          var column = index % categoryColumns;
          var rowOrder = row % 2 === 0 ? column : categoryColumns - 1 - column;
          element.style.setProperty('--motion-delay', ((row * categoryColumns + rowOrder) * 95) + 'ms');
          targets.push(element);
        });
        prepare('.home-featured-section .product-card, .related-grid .product-card', 'motion-card-reveal', 95, 5);
        prepare('.catalogue-layout .product-card', 'motion-card-reveal', 95, 4);

        if (!targets.length) {
          root.classList.remove('motion-enabled');
          return;
        }

        root.classList.add('motion-enabled');
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            entry.target.classList.add('is-revealed');
            observer.unobserve(entry.target);
          });
        }, { threshold: .1, rootMargin: '0px 0px -8% 0px' });

        motionObserver = observer;
        targets.forEach(function (target) { observer.observe(target); });
      }

      function positionFilterDropdown(dropdown, trigger) {

        var triggerRect = trigger.getBoundingClientRect();

      window.addEventListener('hashchange', function () {
        var nextRoute = routeInfo();
        if (nextRoute.name === 'products' && !nextRoute.query.get('category')) {
          state.filters.category = 'all';
          state.filters.brands = [];
          state.filters.techKey = '';
          state.filters.techValue = '';
          state.page = 1;
        }
        state.menuOpen = false;
        state.filterOpen = false;
        document.body.classList.remove('menu-open');
        renderRoute();
      });
      window.addEventListener('scroll', updateAnnouncement, { passive: true });
      window.addEventListener('resize', function () {
        if (window.innerWidth > 850 && state.menuOpen) {
          setMenuState(false);
        }
        updateAnnouncement();
      }, { passive: true });

      function loadFallbackCatalogue() {
        if (window.AMF_CATALOG_FALLBACK) return Promise.resolve(window.AMF_CATALOG_FALLBACK);
        return new Promise(function (resolve, reject) {
          var script = document.createElement('script');
          script.src = config.catalogue.fallbackPath;
          script.async = true;
          script.onload = function () {
            if (window.AMF_CATALOG_FALLBACK) resolve(window.AMF_CATALOG_FALLBACK);
            else reject(new Error('Fallback catalogue did not load'));
          };
          script.onerror = function () { reject(new Error('Fallback catalogue request failed')); };
          document.head.appendChild(script);
        });
      }

      function loadCatalogue() {
        state.error = '';
        if (window.location.protocol === 'file:') {
          loadFallbackCatalogue().then(function (catalog) {
            setCatalogue(catalog);
            renderRoute({ focus: false });
          }).catch(function () {
            clearCatalogue();
            state.error = 'fallback';
            renderRoute({ focus: false });
          });
          return;
        }
        fetch(config.catalogue.path || 'catalogue/catalog.json')
          .then(function (response) {
            if (!response.ok) throw new Error('Catalogue request failed');
            return response.json();
          })
          .then(function (catalog) {
            setCatalogue(catalog);
            renderRoute({ focus: false });
          })
          .catch(function () {
            loadFallbackCatalogue().then(function (catalog) {
              setCatalogue(catalog);
              renderRoute({ focus: false });
            }).catch(function () {
              clearCatalogue();
              state.error = 'catalogue';
              renderRoute({ focus: false });
            });
          });
      }

      loadCatalogue();
    }());
  </script>
</body>
</html>
